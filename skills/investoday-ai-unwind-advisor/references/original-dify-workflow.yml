          \            recent.append(it)\n\n        # 按时间降序\n        recent.sort(\n\
          \            key=lambda x: x.get(\"date\") or x.get(\"pubTime\") or x.get(\"\
          pub_time\") or \"\",\n            reverse=True,\n        )\n\n        news_list\
          \ = _build_unified_news_list(recent)\n        return {\"news_list\": json.dumps(news_list,\
          \ ensure_ascii=False)}\n    except Exception as e:\n        return {\"news_list\"\
          : json.dumps([], ensure_ascii=False)}\n\n\ndef _extract_items(arg1) -> List[Dict[str,\
          \ Any]]:\n    \"\"\"\n    从 Dify/API 新闻输出中提取 data 数组。\n    支持格式：\n    -\
          \ 新闻输出示例：{\"text\":\"...\",\"files\":[],\"json\":[{\"data\":[...],\"data_schema\"\
