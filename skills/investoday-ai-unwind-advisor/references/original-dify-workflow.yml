          \ if isinstance(data_list[0], dict) else {}\n        expire_date = latest.get(\"\
          expireDate\")\n        in_period = expire_date is None or expire_date ==\
          \ \"\" or expire_date == \"null\"\n        return {\"is_signal_period\"\
