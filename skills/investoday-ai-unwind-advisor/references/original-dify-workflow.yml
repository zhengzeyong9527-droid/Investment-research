        code: "# -*- coding: utf-8 -*-\n\"\"\"\n研报节点输出预处理：去重、按时间倒序排序、格式化为文本，最多保留最近15篇以控制\
          \ token 消耗。\n输入：研报节点输出，格式为 {\"files\": [], \"json\": [{\"data\": [报告列表],\
          \ ...}], \"text\": \"...\"}\n\"\"\"\n\nimport json\nfrom datetime import\
          \ datetime\nfrom typing import List, Dict, Any, Optional\n\nMAX_REPORTS\
          \ = 15  # 最多保留最近 N 篇，防止消耗过多 token\n\n\ndef main(arg1: str) -> dict:\n  \
          \  \"\"\"\n    入口：接收研报节点输出，返回去重、按时间倒序、格式化后的文本（最多15篇）。\n    返回: {\"report_text\"\
          : \"格式化后的研报文本\"}\n    \"\"\"\n    try:\n        items = _extract_reports(arg1)\n\
          \        deduped = _deduplicate_reports(items)\n        sorted_items = _sort_by_date_desc(deduped)\n\
          \        limited = sorted_items[:MAX_REPORTS]\n        report_text = _format_reports_to_text(limited)\n\
          \        return {\"report_text\": report_text}\n    except Exception:\n\
          \        return {\"report_text\": \"暂无研报数据或解析失败。\"}\n\n\ndef _extract_reports(arg:\
          \ Any) -> List[Dict[str, Any]]:\n    \"\"\"\n    从研报节点输出中提取报告列表。\n    支持：1)\
          \ 完整对象 {\"json\": [{\"data\": [...]}]}  2) 直接数组 [{\"data\": [...]}]\n  \
          \  \"\"\"\n    items: List[Dict[str, Any]] = []\n\n    if isinstance(arg,\
          \ str):\n        try:\n            root = json.loads(arg)\n        except\
          \ Exception:\n            return []\n    else:\n        root = arg\n\n \
          \   if not root:\n        return []\n\n    # 研报节点输出：根对象带 \"json\" 键（完整输出格式）\n\
          \    if isinstance(root, dict) and \"json\" in root:\n        json_list\
          \ = root[\"json\"]\n        if isinstance(json_list, list):\n          \
          \  for elem in json_list:\n                if isinstance(elem, dict) and\
          \ \"data\" in elem and isinstance(elem[\"data\"], list):\n             \
          \       items.extend(elem[\"data\"])\n        return items\n\n    # 研报节点\
          \ \"text\" 字段：解析后为 {\"data\": [报告列表], ...}，顶层直接是 data 数组\n    if isinstance(root,\
          \ dict) and \"data\" in root and isinstance(root.get(\"data\"), list):\n\
          \        items.extend(root[\"data\"])\n        return items\n\n    # 兼容：根为数组，每项为\
          \ {\"data\": [...]}\n    if isinstance(root, list):\n        for elem in\
          \ root:\n            try:\n                if isinstance(elem, str):\n \
          \                   data_obj = json.loads(elem)\n                else:\n\
          \                    data_obj = elem\n                if isinstance(data_obj,\
          \ dict) and \"data\" in data_obj and isinstance(data_obj[\"data\"], list):\n\
          \                    items.extend(data_obj[\"data\"])\n            except\
          \ Exception:\n                continue\n\n    return items\n\n\ndef _deduplicate_reports(items:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"按 guid 或 reportId\
          \ 去重，保留首次出现的记录。\"\"\"\n    seen: set = set()\n    result: List[Dict[str,\
          \ Any]] = []\n    for it in items:\n        key = it.get(\"guid\") or it.get(\"\
          reportId\")\n        if key is None:\n            key = f\"{it.get('title',\
          \ '')}|{it.get('date', '')}\"\n        key = str(key).strip()\n        if\
          \ not key or key in seen:\n            continue\n        seen.add(key)\n\
          \        result.append(it)\n    return result\n\n\ndef _sort_by_date_desc(items:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"按 date 字段倒序排序，无日期或解析失败排到末尾。\"\
          \"\"\n    def sort_key(x: Dict[str, Any]) -> str:\n        d = x.get(\"\
          date\") or x.get(\"pubTime\") or \"\"\n        return d if d else \"0000-00-00\
          \ 00:00:00\"\n\n    return sorted(items, key=sort_key, reverse=True)\n\n\
          \ndef _format_reports_to_text(items: List[Dict[str, Any]], max_content_len:\
          \ Optional[int] = 8000) -> str:\n    \"\"\"\n    将研报列表格式化为可读文本。\n    每条包含：序号、标题、日期、机构、作者、语种、内容（可截断）。\n\
          \    \"\"\"\n    if not items:\n        return \"暂无研报数据。\"\n\n    lines:\
          \ List[str] = []\n    date_fmt = \"%Y-%m-%d %H:%M:%S\"\n\n    for idx, r\
          \ in enumerate(items, 1):\n        title = (r.get(\"title\") or \"\").strip()\
          \ or \"无标题\"\n        date_str = (r.get(\"date\") or r.get(\"pubTime\")\
          \ or \"\").strip()\n        institution = (r.get(\"institutionName\") or\
          \ \"\").strip() or \"—\"\n        author = (r.get(\"author\") or \"\").strip()\
          \ or \"—\"\n        lang = (r.get(\"reportLanguage\") or \"\").strip() or\
          \ \"—\"\n        content = (r.get(\"content\") or \"\").strip()\n      \
          \  if max_content_len and len(content) > max_content_len:\n            content\
          \ = content[:max_content_len] + \"…[内容已截断]\"\n\n        block = [\n    \
          \        \"\",\n            f\"【{idx}】 {title}\",\n            f\"日期：{date_str}\
          \ | 机构：{institution} | 作者：{author} | 语种：{lang}\",\n            \"内容：\",\n\
          \            content or \"（无正文）\",\n        ]\n        lines.append(\"\\\
          n\".join(block))\n\n    header = \"【研报列表】以下研报已去重、按发布时间倒序排列，最多展示最近15篇。\\\
          n\"\n    return header + \"\\n\".join(lines).strip()\n"
