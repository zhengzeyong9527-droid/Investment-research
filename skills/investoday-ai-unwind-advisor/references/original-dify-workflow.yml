    - data:
        code: "# Dify 代码节点：匹配共同基金（ETF轮动策略持仓 ∩ 行业持仓基金列表）\n# 输入变量：\n# - etf_rotation_data（String\
          \ 或 Object 或 List）\n# - industry_fund_list_data（String 或 Object 或 List）\n\
          # 输出变量：\n# - matched_funds（List[Object]）\n# - has_match（String: \"true\"\
          /\"false\"）\n\nimport json\n\n\ndef _to_json(value):\n    if value is None:\n\
          \        return None\n    if isinstance(value, (dict, list)):\n        return\
          \ value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _parse_to_dict(data_input):\n    \"\"\"\
          解析输入为 dict 或 None，兼容 Dify/工具节点常见包装。\"\"\"\n    if not data_input:\n    \
          \    return None\n\n    # 列表包装：取第一项\n    if isinstance(data_input, list):\n\
          \        if not data_input:\n            return None\n        first = data_input[0]\n\
          \        if isinstance(first, dict):\n            if first.get(\"text\"\
          ):\n                return _to_json(first.get(\"text\"))\n            if\
          \ first.get(\"json\") and isinstance(first[\"json\"], list) and first[\"\
          json\"]:\n                candidate = first[\"json\"][0]\n             \
          \   return candidate if isinstance(candidate, dict) else None\n        \
          \    return first\n        if isinstance(first, str):\n            return\
          \ _to_json(first)\n        return None\n\n    # 字符串：直接解析\n    if isinstance(data_input,\
          \ str):\n        return _to_json(data_input)\n\n    # dict：处理常见包装\n    if\
          \ isinstance(data_input, dict):\n        if data_input.get(\"text\"):\n\
          \            return _to_json(data_input.get(\"text\"))\n        if data_input.get(\"\
          json\") and isinstance(data_input[\"json\"], list) and data_input[\"json\"\
          ]:\n            candidate = data_input[\"json\"][0]\n            return\
          \ candidate if isinstance(candidate, dict) else None\n        return data_input\n\
          \n    return None\n\n\ndef _extract_data_list(parsed_dict):\n    \"\"\"\
          从 parsed_dict 中取 data 列表。\"\"\"\n    if not isinstance(parsed_dict, dict):\n\
          \        return []\n    data = parsed_dict.get(\"data\", [])\n    if isinstance(data,\
          \ list):\n        return data\n    if isinstance(data, dict):\n        return\
          \ [data]\n    return []\n\n\ndef _format_date(date_str):\n    \"\"\"格式化日期：'2026-01-05\
          \ 00:00:00' → '2026-01-05'；空则返回 'null'。\"\"\"\n    if date_str is None:\n\
          \        return \"null\"\n    if not isinstance(date_str, str):\n      \
          \  date_str = str(date_str)\n    text = date_str.strip()\n    if not text\
          \ or text.lower() == \"null\":\n        return \"null\"\n    return text.split()[0]\
          \ if text else \"null\"\n\n\ndef main(etf_rotation_data, industry_fund_list_data):\n\
          \    \"\"\"\n    找出同时出现在两个数据源中的基金（按 fundCode 匹配）：\n    - etf_rotation_data：ETF轮动策略数据源（筛“仍在持仓”：etfExitDate\
          \ 为空 且 holdingExitFlag==1）\n    - industry_fund_list_data：行业持仓基金列表数据源\n\
          \    \"\"\"\n    try:\n        etf_json = _parse_to_dict(etf_rotation_data)\n\
          \        industry_json = _parse_to_dict(industry_fund_list_data)\n\n   \
          \     etf_list = _extract_data_list(etf_json)\n        industry_list = _extract_data_list(industry_json)\n\
          \n        # ETF轮动：筛仍在持仓的基金\n        active_etfs = {}\n        for etf in\
          \ etf_list:\n            if not isinstance(etf, dict):\n               \
          \ continue\n            exit_date = etf.get(\"etfExitDate\")\n         \
          \   holding_flag = etf.get(\"holdingExitFlag\", 0)\n\n            exit_date_empty\
          \ = exit_date is None or exit_date == \"\" or exit_date == \"null\"\n  \
          \          try:\n                holding_ok = int(holding_flag) == 1\n \
          \           except Exception:\n                holding_ok = False\n\n  \
          \          if exit_date_empty and holding_ok:\n                fund_code\
          \ = (etf.get(\"fundCode\") or \"\").strip()\n                if fund_code:\n\
          \                    active_etfs[fund_code] = etf\n\n        # 行业持仓：fundCode\
          \ -> fund\n        industry_funds = {}\n        for fund in industry_list:\n\
          \            if not isinstance(fund, dict):\n                continue\n\
          \            fund_code = (fund.get(\"fundCode\") or \"\").strip()\n    \
          \        if fund_code:\n                industry_funds[fund_code] = fund\n\
          \n        matched_funds = []\n        for fund_code, etf_info in active_etfs.items():\n\
          \            industry_info = industry_funds.get(fund_code)\n           \
          \ if not industry_info:\n                continue\n\n            matched_funds.append(\n\
          \                {\n                    \"fundCode\": fund_code,\n     \
          \               \"fundName\": etf_info.get(\"fundName\", \"\") or \"\",\n\
          \                    \"industryCode\": etf_info.get(\"industryCode\", \"\
          \") or \"\",\n                    \"industryName\": etf_info.get(\"industryName\"\
          , \"\") or \"\",\n                    \"etfEntryDate\": _format_date(etf_info.get(\"\
          etfEntryDate\", \"\")),\n                    \"holdingPercentageAnnualNetAssets\"\
          : industry_info.get(\n                        \"holdingPercentageAnnualNetAssets\"\
          , None\n                    ),\n                    \"publishDate\": _format_date(industry_info.get(\"\
          date\", \"\")),\n                }\n            )\n\n        return {\n\
          \            \"matched_funds\": matched_funds,\n            \"has_match\"\
          : \"true\" if matched_funds else \"false\",\n        }\n\n    except Exception:\n\
          \        return {\"matched_funds\": [], \"has_match\": \"false\"}\n\n"
        code_language: python3
        outputs:
          has_match:
            children: null
            type: string
          matched_funds:
            children: null
            type: array[object]
