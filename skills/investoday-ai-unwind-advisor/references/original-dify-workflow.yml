    - data:
        code: "# Dify 代码节点：波段信号解套方案生成（在信号期内使用）\n# 输入变量：\n# - signal_detail_data（String\
          \ 或 Object 或 List）：股票解套信号明细数据\n# - signal_stat_data（String 或 Object 或 List）：股票解套信号统计数据\n\
          # 输出变量：signal_plan（String，格式化文本）\n\nimport json\nfrom datetime import datetime\n\
          \n\ndef _to_json(value):\n    if value is None:\n        return None\n \
          \   if isinstance(value, (dict, list)):\n        return value\n    if isinstance(value,\
          \ str):\n        text = value.strip()\n        if not text:\n          \
          \  return None\n        try:\n            return json.loads(text)\n    \
          \    except Exception:\n            return None\n    return None\n\n\ndef\
          \ _parse_input(data_input):\n    \"\"\"解析输入为 dict（含 data 列表）或 None。兼容 text/json/列表等包装。\"\
          \"\"\n    if not data_input:\n        return None\n    if isinstance(data_input,\
          \ list):\n        if not data_input:\n            return None\n        first\
          \ = data_input[0]\n        if isinstance(first, dict):\n            if first.get(\"\
          text\"):\n                return _to_json(first.get(\"text\"))\n       \
          \     if first.get(\"json\") and isinstance(first.get(\"json\"), list) and\
          \ first[\"json\"]:\n                c = first[\"json\"][0]\n           \
          \     return c if isinstance(c, dict) else None\n            return first\n\
          \        if isinstance(first, str):\n            return _to_json(first)\n\
          \        return None\n    if isinstance(data_input, str):\n        return\
          \ _to_json(data_input)\n    if isinstance(data_input, dict):\n        if\
          \ data_input.get(\"text\"):\n            return _to_json(data_input.get(\"\
          text\"))\n        if data_input.get(\"json\") and isinstance(data_input.get(\"\
          json\"), list) and data_input[\"json\"]:\n            c = data_input[\"\
          json\"][0]\n            return c if isinstance(c, dict) else None\n    \
          \    return data_input\n    return None\n\n\ndef _format_date(date_str):\n\
          \    \"\"\"2025-12-29 00:00:00 → 2025/12/29；空 → \"null\"。\"\"\"\n    if\
          \ not date_str:\n        return \"null\"\n    if not isinstance(date_str,\
          \ str):\n        date_str = str(date_str)\n    s = date_str.strip()\n  \
          \  if not s or s.lower() == \"null\":\n        return \"null\"\n    try:\n\
          \        dt = datetime.strptime(s.split()[0], \"%Y-%m-%d\")\n        return\
          \ dt.strftime(\"%Y/%m/%d\")\n    except Exception:\n        try:\n     \
          \       return s.split()[0].replace(\"-\", \"/\")\n        except Exception:\n\
          \            return \"null\"\n\n\ndef _safe_float(value, default=\"null\"\
          ):\n    if value is None or value == \"\":\n        return default\n   \
          \ try:\n        return float(value)\n    except (TypeError, ValueError):\n\
          \        return default\n\n\ndef _safe_int(value, default=\"null\"):\n \
          \   if value is None or value == \"\":\n        return default\n    try:\n\
          \        return int(value)\n    except (TypeError, ValueError):\n      \
          \  return default\n\n\ndef _get_first_record(parsed):\n    \"\"\"从解析结果中取\
          \ data[0]。\"\"\"\n    if not parsed or not isinstance(parsed, dict):\n \
          \       return {}\n    data = parsed.get(\"data\", [])\n    if not isinstance(data,\
          \ list) or not data:\n        return {}\n    return data[0] if isinstance(data[0],\
          \ dict) else {}\n\n\ndef main(signal_detail_data, signal_stat_data):\n \
          \   \"\"\"\n    生成完整的波段信号解套方案：买入价、止盈止损、信号有效期、历史统计等 9 项关键信息。\n    \"\"\"\n\
          \    try:\n        detail_json = _parse_input(signal_detail_data)\n    \
          \    stat_json = _parse_input(signal_stat_data)\n        detail_data = _get_first_record(detail_json)\n\
          \        stat_data = _get_first_record(stat_json)\n\n        buy_date =\
          \ _format_date(detail_data.get(\"buyDate\", \"\"))\n        buy_price_ref\
          \ = _safe_float(detail_data.get(\"buyPriceReference\"))\n        take_profit\
          \ = _safe_float(detail_data.get(\"takeProfitPrice\"))\n        stop_loss\
          \ = _safe_float(detail_data.get(\"stopLossPrice\"))\n        position =\
          \ _safe_float(detail_data.get(\"stockPosition\"))\n        generation_date\
          \ = _format_date(detail_data.get(\"generationDate\", \"\"))\n        expire_date\
          \ = _format_date(detail_data.get(\"expireDate\", \"\"))\n\n        win_rate_1y\
          \ = _safe_float(stat_data.get(\"winRate1y\"))\n        return_sum_1y = _safe_float(stat_data.get(\"\
          returnSum1y\"))\n        signal_count_1y = _safe_int(stat_data.get(\"signalCount1y\"\
          ), 1)\n        holding_days_avg = _safe_int(stat_data.get(\"holdingDaysAvg1y\"\
          ))\n\n        buy_price_str = f\"{buy_price_ref:.2f}元\" if buy_price_ref\
          \ != \"null\" else \"null\"\n\n        if take_profit != \"null\" and buy_price_ref\
          \ != \"null\":\n            take_profit_pct = (take_profit - buy_price_ref)\
          \ / buy_price_ref * 100\n            take_profit_str = f\"{take_profit:.2f}元（+{take_profit_pct:.2f}%）\"\
          \n        else:\n            take_profit_str = \"null\"\n\n        if stop_loss\
          \ != \"null\" and buy_price_ref != \"null\":\n            stop_loss_pct\
          \ = (stop_loss - buy_price_ref) / buy_price_ref * 100\n            stop_loss_str\
          \ = f\"{stop_loss:.2f}元（{stop_loss_pct:.2f}%）\"\n        else:\n       \
          \     stop_loss_str = \"null\"\n\n        if position != \"null\":\n   \
          \         position_str = f\"{int(position * 100)}%\"\n        else:\n  \
          \          position_str = \"null\"\n\n        if generation_date != \"null\"\
          :\n            if expire_date != \"null\":\n                signal_period_str\
          \ = f\"{generation_date} - {expire_date}\"\n            else:\n        \
          \        signal_period_str = f\"{generation_date} - 进行中\"\n        else:\n\
          \            signal_period_str = \"null\"\n\n        win_rate_str = f\"\
          {win_rate_1y * 100:.2f}%\" if win_rate_1y != \"null\" else \"null\"\n\n\
          \        if return_sum_1y != \"null\" and signal_count_1y != \"null\":\n\
          \            avg_return = return_sum_1y / signal_count_1y * 100\n      \
          \      avg_return_str = f\"{avg_return:.2f}%\"\n        else:\n        \
          \    avg_return_str = \"null\"\n\n        holding_days_str = f\"{holding_days_avg}天\"\
          \ if holding_days_avg != \"null\" else \"null\"\n\n        wave_signal_text\
          \ = f\"\"\"波段信号：\n信号买入日期：{buy_date}\n参考买入价格：{buy_price_str}\n止盈价：{take_profit_str}\n\
          止损价：{stop_loss_str}\n建议仓位：{position_str}\n信号有效期：{signal_period_str}\n近1年信号胜率：{win_rate_str}\n\
          近1年平均涨幅：{avg_return_str}\n近1年平均持仓天数：{holding_days_str}\"\"\"\n\n       \
          \ return {\"signal_plan\": wave_signal_text.strip()}\n\n    except Exception\
          \ as e:\n        return {\"signal_plan\": f\"波段信号生成错误: {str(e)}\"}\n"
        code_language: python3
