          \ None\n    condition2 = f_trend in (\"变好\", \"平稳\")\n\n    quality_good\
          \ = condition1 and condition2\n    return {\n        \"type\": \"优质股票\"\
          \ if quality_good else \"基本面不佳\",\n        \"result\": \"true\" if quality_good\
          \ else \"false\",\n    }\n"
