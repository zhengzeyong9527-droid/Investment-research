    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\n公告节点输出预处理：提取、一个月内过滤、去重、按时间倒序、格式化为文本，最多保留最近20条以控制\
          \ token 消耗。\n输入：公告节点输出，格式为 {\"files\": [], \"json\": [{\"data\": [公告列表],\
          \ ...}], \"text\": \"...\"}\n\"\"\"\n\nimport json\nfrom datetime import\
          \ datetime, timedelta\nfrom typing import List, Dict, Any, Optional\n\n\
          MAX_ANNOUNCEMENTS = 20  # 最多保留最近 N 条，防止消耗过多 token\n\n# riskType 数字 -> 中文说明（与\
          \ data_schema 一致）\nRISK_TYPE_MAP = {\n    100000: \"ST风险\",\n    110000:\
          \ \"产能收缩\",\n    120000: \"终止定增\",\n    130000: \"质押数据\",\n    140000: \"\
          平仓风险\",\n    151000: \"监管处罚-立案调查\",\n    151100: \"监管处罚-其他处罚\",\n    160000:\
          \ \"限售解禁\",\n    170000: \"业绩预告\",\n    180000: \"灾害事故\",\n    191000: \"\
          增减持公告-减持预披露\",\n    191100: \"增减持公告-减持终止\",\n    191200: \"增减持公告-减持进展\"\
          ,\n    200000: \"仲裁\",\n    210000: \"重组终止\",\n    220000: \"资产减值\",\n \
          \   999999: \"其他\",\n    230000: \"上市终止\",\n}\n\n\ndef main(arg1: str) ->\
          \ dict:\n    \"\"\"\n    入口：接收公告节点输出，返回一个月内、去重、按时间倒序、格式化后的文本（最多20条）。\n \
          \   返回: {\"announcement_text\": \"格式化后的公告文本\"}\n    \"\"\"\n    try:\n \
          \       items = _extract_announcements(arg1)\n        filtered = _filter_within_one_month(items)\n\
          \        deduped = _deduplicate_announcements(filtered)\n        sorted_items\
          \ = _sort_by_date_desc(deduped)\n        limited = sorted_items[:MAX_ANNOUNCEMENTS]\n\
          \        announcement_text = _format_announcements_to_text(limited)\n  \
          \      return {\"announcement_text\": announcement_text}\n    except Exception:\n\
          \        return {\"announcement_text\": \"暂无公告数据或解析失败。\"}\n\n\ndef _extract_announcements(arg:\
          \ Any) -> List[Dict[str, Any]]:\n    \"\"\"\n    从公告节点输出中提取公告列表。\n    支持：1)\
          \ 完整对象 {\"json\": [{\"data\": [...]}]}  2) 根或 json 项 {\"data\": [...]}\n\
          \    3) 若 json 为空或不存在，则从 text 解析取 data。\n    \"\"\"\n    items: List[Dict[str,\
          \ Any]] = []\n\n    if isinstance(arg, str):\n        try:\n           \
          \ root = json.loads(arg)\n        except Exception:\n            return\
          \ []\n    else:\n        root = arg\n\n    if not root:\n        return\
          \ []\n\n    # 公告节点输出：根对象带 \"json\" 键（完整输出格式）\n    if isinstance(root, dict)\
          \ and \"json\" in root:\n        json_list = root[\"json\"]\n        if\
          \ isinstance(json_list, list):\n            for elem in json_list:\n   \
          \             if isinstance(elem, dict) and \"data\" in elem and isinstance(elem[\"\
          data\"], list):\n                    items.extend(elem[\"data\"])\n\n  \
          \  # 根对象直接带 \"data\"（或上面从 json 未取到时的补充）\n    if isinstance(root, dict) and\
          \ \"data\" in root and isinstance(root.get(\"data\"), list):\n        items.extend(root[\"\
          data\"])\n\n    # 若仍未取到，尝试从 text 字段解析\n    if not items and isinstance(root,\
          \ dict) and \"text\" in root:\n        text_val = root[\"text\"]\n     \
          \   if isinstance(text_val, str):\n            try:\n                parsed\
          \ = json.loads(text_val)\n                if isinstance(parsed, dict) and\
          \ \"data\" in parsed and isinstance(parsed.get(\"data\"), list):\n     \
          \               items.extend(parsed[\"data\"])\n            except Exception:\n\
          \                pass\n\n    # 兼容：根为数组，每项为 {\"data\": [...]}\n    if not\
          \ items and isinstance(root, list):\n        for elem in root:\n       \
          \     try:\n                if isinstance(elem, str):\n                \
          \    data_obj = json.loads(elem)\n                else:\n              \
          \      data_obj = elem\n                if isinstance(data_obj, dict) and\
          \ \"data\" in data_obj and isinstance(data_obj[\"data\"], list):\n     \
          \               items.extend(data_obj[\"data\"])\n            except Exception:\n\
          \                continue\n\n    return items\n\n\ndef _filter_within_one_month(items:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"仅保留最近 30 天内的公告；无日期或解析失败则保留。\"\
          \"\"\n    thirty_days_ago = datetime.now() - timedelta(days=30)\n    result:\
          \ List[Dict[str, Any]] = []\n    for it in items:\n        date_str = (it.get(\"\
          date\") or \"\").strip()\n        if not date_str:\n            result.append(it)\n\
          \            continue\n        try:\n            t = datetime.strptime(date_str,\
          \ \"%Y-%m-%d %H:%M:%S\")\n            if t >= thirty_days_ago:\n       \
          \         result.append(it)\n        except Exception:\n            result.append(it)\n\
          \    return result\n\n\ndef _deduplicate_announcements(items: List[Dict[str,\
          \ Any]]) -> List[Dict[str, Any]]:\n    \"\"\"按 guid 或 announcementId 或 title+date\
          \ 去重，保留首次出现的记录。\"\"\"\n    seen: set = set()\n    result: List[Dict[str,\
          \ Any]] = []\n    for it in items:\n        key = it.get(\"guid\") or it.get(\"\
          announcementId\")\n        if key is None:\n            key = f\"{it.get('title',\
          \ '')}|{it.get('date', '')}\"\n        key = str(key).strip()\n        if\
          \ not key or key in seen:\n            continue\n        seen.add(key)\n\
          \        result.append(it)\n    return result\n\n\ndef _sort_by_date_desc(items:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"按 date 字段倒序排序，无日期或解析失败排到末尾。\"\
          \"\"\n    def sort_key(x: Dict[str, Any]) -> str:\n        d = x.get(\"\
          date\") or \"\"\n        return d if d else \"0000-00-00 00:00:00\"\n\n\
          \    return sorted(items, key=sort_key, reverse=True)\n\n\ndef _risk_type_label(risk_type:\
          \ Any) -> str:\n    \"\"\"将 riskType 数字映射为中文说明。\"\"\"\n    if risk_type\
          \ is None:\n        return \"其他\"\n    try:\n        code = int(risk_type)\n\
          \        return RISK_TYPE_MAP.get(code, \"其他\")\n    except (ValueError,\
          \ TypeError):\n        return \"其他\"\n\n\ndef _format_announcements_to_text(items:\
          \ List[Dict[str, Any]]) -> str:\n    \"\"\"\n    将公告列表格式化为可读文本。\n    每条包含：序号、发布日期、标题、风险类型、公告来源、是否有附件、附件链接。\n\
          \    \"\"\"\n    if not items:\n        return \"暂无公告数据。\"\n\n    lines:\
          \ List[str] = []\n    for idx, a in enumerate(items, 1):\n        title\
          \ = (a.get(\"title\") or \"\").strip() or \"无标题\"\n        date_str = (a.get(\"\
          date\") or \"\").strip()\n        risk_label = _risk_type_label(a.get(\"\
          riskType\"))\n        source = (a.get(\"announcementSource\") or \"\").strip()\
          \ or \"—\"\n        has_attach = a.get(\"hasAttachment\", 0)\n        attach_text\
          \ = \"有\" if has_attach else \"无\"\n        attach_url = (a.get(\"attachmentUrl\"\
          ) or \"\").strip()\n        attach_line = f\"附件：{attach_text}\"\n      \
          \  if attach_url and has_attach:\n            attach_line += f\" | 链接：{attach_url}\"\
          \n\n        block = [\n            \"\",\n            f\"【{idx}】 {title}\"\
          ,\n            f\"发布日期：{date_str} | 风险类型：{risk_label} | 来源：{source}\",\n\
          \            attach_line,\n        ]\n        lines.append(\"\\n\".join(block))\n\
          \n    header = f\"【公告列表】以下为该公司最近一个月内公告，已去重、按发布时间倒序，最多展示最近{MAX_ANNOUNCEMENTS}条。\\\
          n\"\n    return header + \"\\n\".join(lines).strip()\n"
        code_language: python3
        outputs:
          announcement_text:
            children: null
            type: string
        selected: false
        title: 公告提取
        type: code
