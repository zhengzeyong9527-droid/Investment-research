    - data:
        code: "# Dify 代码节点：股票质地判断（财务分项 + F 分数）\n# 输入变量：\n# - finance_score_response（String\
          \ 或 Object）：股票财务分项最新评分\n# - financial_strength_data（String 或 Object 或 List）：股票财务实力最新指标（含\
          \ F 分数 f2220）\n# 输出变量：type（优质股票/基本面不佳）、result（\"true\"/\"false\"）\n# 判定规则：优质股票\
          \ = 至少2项高于行业平均 且 F分数状态为变好或平稳\n\nimport json\n\n\ndef _to_json(value):\n\
          \    if value is None:\n        return None\n    if isinstance(value, (dict,\
          \ list)):\n        return value\n    if isinstance(value, str):\n      \
          \  text = value.strip()\n        if not text:\n            return None\n\
          \        try:\n            return json.loads(text)\n        except Exception:\n\
          \            return None\n    return None\n\n\ndef _extract_data_list(api_response):\n\
          \    \"\"\"从接口返回中解析出 data 列表。支持 json[0].data、text 内 JSON、顶层 data。\"\"\"\n\
          \    if api_response is None:\n        api_response = {}\n    if isinstance(api_response,\
          \ str):\n        api_response = _to_json(api_response)\n    if not isinstance(api_response,\
          \ dict):\n        return []\n    if api_response.get(\"json\") and isinstance(api_response[\"\
          json\"], list) and api_response[\"json\"]:\n        first = api_response[\"\
          json\"][0]\n        if isinstance(first, dict) and \"data\" in first:\n\
          \            data = first[\"data\"]\n            return data if isinstance(data,\
          \ list) else [data]\n    if api_response.get(\"text\"):\n        parsed\
          \ = _to_json(api_response[\"text\"])\n        if isinstance(parsed, dict)\
          \ and \"data\" in parsed:\n            data = parsed[\"data\"]\n       \
          \     return data if isinstance(data, list) else [data]\n    if \"data\"\
          \ in api_response:\n        data = api_response[\"data\"]\n        if isinstance(data,\
          \ list) and data:\n            return data\n        if isinstance(data,\
          \ dict):\n            return [data]\n    return []\n\n\ndef _above_industry_count(record):\n\
          \    \"\"\"统计盈利能力、成长能力、财务实力中高于行业平均的项数（个股得分 > 行业得分）。\"\"\"\n    if not isinstance(record,\
          \ dict):\n        return 0\n    above = 0\n    if record.get(\"profitabilityScore\"\
          ) is not None and record.get(\"industryProfitabilityScore\") is not None:\n\
          \        try:\n            if float(record[\"profitabilityScore\"]) > float(record[\"\
          industryProfitabilityScore\"]):\n                above += 1\n        except\
          \ (TypeError, ValueError):\n            pass\n    if record.get(\"growthScore\"\
          ) is not None and record.get(\"industryGrowthScore\") is not None:\n   \
          \     try:\n            if float(record[\"growthScore\"]) > float(record[\"\
          industryGrowthScore\"]):\n                above += 1\n        except (TypeError,\
          \ ValueError):\n            pass\n    if record.get(\"financialStrengthScore\"\
          ) is not None and record.get(\"industryFinancialStrengthScore\") is not\
          \ None:\n        try:\n            if float(record[\"financialStrengthScore\"\
          ]) > float(record[\"industryFinancialStrengthScore\"]):\n              \
          \  above += 1\n        except (TypeError, ValueError):\n            pass\n\
          \    return above\n\n\ndef _parse_financial_strength(data_input):\n    \"\
          \"\"解析财务实力数据，返回 data 对应的首条记录（dict）或 None。\"\"\"\n    if not data_input:\n\
          \        return None\n    if isinstance(data_input, str):\n        data_input\
          \ = _to_json(data_input)\n    if isinstance(data_input, list) and data_input\
          \ and isinstance(data_input[0], dict):\n        first = data_input[0]\n\
          \        if first.get(\"text\"):\n            data_input = _to_json(first[\"\
          text\"])\n        elif first.get(\"json\") and isinstance(first.get(\"json\"\
          ), list) and first[\"json\"]:\n            data_input = first[\"json\"][0]\
          \ if isinstance(first[\"json\"][0], dict) else None\n        else:\n   \
          \         data_input = first\n    if not isinstance(data_input, dict):\n\
          \        return None\n    if data_input.get(\"text\"):\n        data_input\
          \ = _to_json(data_input[\"text\"])\n    if data_input.get(\"json\") and\
          \ isinstance(data_input.get(\"json\"), list) and data_input[\"json\"]:\n\
          \        data_input = data_input[\"json\"][0] if isinstance(data_input[\"\
          json\"][0], dict) else None\n    if not isinstance(data_input, dict) or\
          \ \"data\" not in data_input:\n        return None\n    raw = data_input[\"\
          data\"]\n    if isinstance(raw, dict):\n        return raw\n    if isinstance(raw,\
          \ list) and raw and isinstance(raw[0], dict):\n        return raw[0]\n \
          \   return None\n\n\ndef _get_f_score_trend(record):\n    \"\"\"\n    根据\
          \ F 分数 (f2220) 返回基本面趋势：变好、平稳、变差。\n    F 0,1,2,3 → 变差；4,5,6 → 平稳；7,8,9 →\
          \ 变好。\n    \"\"\"\n    if not isinstance(record, dict):\n        return\
          \ None\n    f_val = record.get(\"f2220\")\n    if f_val is None or f_val\
          \ == \"\":\n        return None\n    try:\n        score = int(f_val)\n\
          \    except (TypeError, ValueError):\n        return None\n    if score\
          \ in (0, 1, 2, 3):\n        return \"变差\"\n    if score in (4, 5, 6):\n\
          \        return \"平稳\"\n    if score in (7, 8, 9):\n        return \"变好\"\
          \n    return None\n\n\ndef main(finance_score_response, financial_strength_data):\n\
          \    \"\"\"\n    优质股票：1）盈利能力、成长能力、财务实力中至少 2 项高于行业平均；\n            2）基本面趋势\
          \ F 分数状态为变好或平稳。\n    否则为基本面不佳。\n    输出：type（优质股票/基本面不佳）、result（\"true\"\
          /\"false\"）。\n    \"\"\"\n    # 条件1：至少 2 项高于行业平均\n    api_response = _to_json(finance_score_response)\n\
          \    data_list = _extract_data_list(api_response or {})\n    above_count\
          \ = _above_industry_count(data_list[0]) if (data_list and isinstance(data_list[0],\
