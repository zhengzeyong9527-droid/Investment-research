    - data:
        code: "import json\nfrom datetime import datetime, timedelta\n\n\ndef subtract_months(dt,\
          \ months):\n    \"\"\"减去指定月份，使用标准库实现\"\"\"\n    month = dt.month - months\n\
          \    year = dt.year\n\n    while month <= 0:\n        month += 12\n    \
          \    year -= 1\n\n    day = dt.day\n    if month == 2:\n        is_leap\
          \ = (year % 4 == 0 and year % 100 != 0) or (year % 400 == 0)\n        max_day\
          \ = 29 if is_leap else 28\n    elif month in [4, 6, 9, 11]:\n        max_day\
          \ = 30\n    else:\n        max_day = 31\n\n    if day > max_day:\n     \
          \   day = max_day\n\n    return dt.replace(year=year, month=month, day=day)\n\
          \n\ndef subtract_years(dt, years):\n    \"\"\"减去指定年份\"\"\"\n    try:\n \
          \       return dt.replace(year=dt.year - years)\n    except ValueError:\n\
          \        return dt.replace(year=dt.year - years, day=28)\n\n\ndef main(current_date_text:\
          \ str, trading_calendar_text: str) -> dict:\n    \"\"\"\n    主函数：计算时间点\n\
          \n    Args:\n        current_date_text: 当前日期文本 (格式: \"2025-10-23\")\n  \
          \      trading_calendar_text: 交易日历JSON数据\n\n    Returns:\n        dict:\
          \ 包含8个时间输出变量\n            - one_day_ago_trading_day: 一日前的交易日\n         \
          \   - one_week_ago_trading_day: 一周前的交易日\n            - one_month_ago_trading_day:\
          \ 一个月前的交易日\n            - one_year_ago: 一年前的自然日期\n            - five_years_ago:\
          \ 五年前的自然日期\n            - three_months_ago: 三个月前的自然日期\n            - six_months_ago:\
          \ 六个月前的自然日期\n            - eighteen_months_ago: 十八个月前的自然日期\n    \"\"\"\n\
          \    try:\n        current_date = datetime.strptime(current_date_text.strip(),\
          \ \"%Y-%m-%d\")\n\n        trading_calendar = json.loads(trading_calendar_text)\n\
          \        trading_data = trading_calendar.get(\"data\", {})\n\n        #\
          \ 获取一日前的交易日\n        one_day_ago_trading_day = (\n            trading_data.get(\"\
          before1Day\", \"\").split(\" \")[0]\n            if trading_data.get(\"\
          before1Day\")\n            else \"\"\n        )\n        if not one_day_ago_trading_day:\n\
          \            one_day_ago_trading_day = (\n                current_date -\
          \ timedelta(days=1)\n            ).strftime(\"%Y-%m-%d\")\n\n        # 获取一周前的交易日\n\
          \        one_week_ago_trading_day = (\n            trading_data.get(\"before1Week\"\
          , \"\").split(\" \")[0]\n            if trading_data.get(\"before1Week\"\
          )\n            else \"\"\n        )\n        if not one_week_ago_trading_day:\n\
          \            seven_days_ago = current_date - timedelta(days=7)\n       \
          \     one_week_ago_trading_day = seven_days_ago.strftime(\"%Y-%m-%d\")\n\
          \n        # 获取一个月前的交易日\n        one_month_ago_trading_day = (\n        \
          \    trading_data.get(\"before1Month\", \"\").split(\" \")[0]\n        \
          \    if trading_data.get(\"before1Month\")\n            else \"\"\n    \
          \    )\n        if not one_month_ago_trading_day:\n            one_month_ago_date\
          \ = subtract_months(current_date, 1)\n            one_month_ago_trading_day\
          \ = one_month_ago_date.strftime(\"%Y-%m-%d\")\n\n        one_year_ago =\
          \ subtract_years(current_date, 1).strftime(\"%Y-%m-%d\")\n        five_years_ago\
          \ = subtract_years(current_date, 5).strftime(\"%Y-%m-%d\")\n        three_months_ago\
          \ = subtract_months(current_date, 3).strftime(\"%Y-%m-%d\")\n        six_months_ago\
          \ = subtract_months(current_date, 6).strftime(\"%Y-%m-%d\")\n        eighteen_months_ago\
          \ = subtract_months(current_date, 18).strftime(\"%Y-%m-%d\")\n\n       \
          \ return {\n            \"one_day_ago_trading_day\": one_day_ago_trading_day,\n\
          \            \"one_week_ago_trading_day\": one_week_ago_trading_day,\n \
          \           \"one_month_ago_trading_day\": one_month_ago_trading_day,\n\
          \            \"one_year_ago\": one_year_ago,\n            \"five_years_ago\"\
          : five_years_ago,\n            \"three_months_ago\": three_months_ago,\n\
          \            \"six_months_ago\": six_months_ago,\n            \"eighteen_months_ago\"\
          : eighteen_months_ago,\n        }\n\n    except Exception:\n        error_date\
          \ = datetime.now().strftime(\"%Y-%m-%d\")\n        return {\n          \
          \  \"one_day_ago_trading_day\": error_date,\n            \"one_week_ago_trading_day\"\
          : error_date,\n            \"one_month_ago_trading_day\": error_date,\n\
          \            \"one_year_ago\": error_date,\n            \"five_years_ago\"\
          : error_date,\n            \"three_months_ago\": error_date,\n         \
          \   \"six_months_ago\": error_date,\n            \"eighteen_months_ago\"\
          : error_date,\n        }\n"
