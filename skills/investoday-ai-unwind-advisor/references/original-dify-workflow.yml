    - data:
        selected: false
        template: "{# 将同赛道基金推荐（数组）转为 string，供变量聚合/LLM 使用 #}\r\n{# 输入：recommended_funds\
          \ — Dify 传入的可能是整颗输出对象 {\"recommended_funds\": [...]} 或直接为数组 #}\r\n\r\n数据来源：同赛道基金推荐（ETF\
          \ 轮动策略）\r\n\r\n{% set fund_list = recommended_funds.recommended_funds if\
          \ (recommended_funds is mapping and recommended_funds.recommended_funds\
          \ is defined) else (recommended_funds if recommended_funds is iterable and\
          \ recommended_funds is not mapping else []) %}\r\n{% if fund_list and fund_list|length\
          \ > 0 %}\r\n同赛道基金推荐（共 {{ fund_list | length }} 只）：\r\n\r\n{% for fund in\
