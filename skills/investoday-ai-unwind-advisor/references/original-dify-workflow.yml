    - data:
        code: "# Dify 代码节点：同赛道基金推荐整合\n# 输入变量：\n# - matched_funds（List[Object] 或 包装）：匹配到的共同基金数组\n\
          # - fund_technical_data（List）：迭代结束后的 output 数组（每项为基金技术指标接口返回）\n# 输出变量：recommended_funds（List[Object]，最多\
          \ 3 只，按占比↓→规模↓排序）\n\nimport json\n\n\ndef _to_json(value):\n    if value\
          \ is None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _ensure_matched_funds_list(matched_funds_input):\n\
          \    \"\"\"将 matched_funds 转为基金对象列表。\"\"\"\n    if not matched_funds_input:\n\
          \        return []\n    if isinstance(matched_funds_input, list):\n    \
          \    if not matched_funds_input:\n            return []\n        first =\
          \ matched_funds_input[0]\n        if isinstance(first, dict) and (\"fundCode\"\
          \ in first or \"fundName\" in first):\n            return matched_funds_input\n\
          \        if isinstance(first, dict) and \"data\" in first:\n           \
          \ data = first[\"data\"]\n            return data if isinstance(data, list)\
          \ else [data]\n        if isinstance(first, dict) and first.get(\"text\"\
          ):\n            parsed = _to_json(first[\"text\"])\n            if isinstance(parsed,\
          \ dict) and \"data\" in parsed:\n                return parsed[\"data\"\
          ] if isinstance(parsed[\"data\"], list) else []\n            return []\n\
          \    if isinstance(matched_funds_input, dict) and \"data\" in matched_funds_input:\n\
          \        data = matched_funds_input[\"data\"]\n        return data if isinstance(data,\
          \ list) else []\n    return []\n\n\ndef _parse_fund_technical_output(output_data):\n\
          \    \"\"\"解析基金技术指标的 output 数组，按 fundCode 提取最新一条记录。\"\"\"\n    result =\
          \ {}\n    if not output_data or not isinstance(output_data, list):\n   \
          \     return result\n    for item in output_data:\n        if not isinstance(item,\
          \ dict):\n            continue\n        text_str = None\n        if \"content\"\
          \ in item and isinstance(item[\"content\"], list) and item[\"content\"]:\n\
          \            text_str = item[\"content\"][0].get(\"text\", \"\") if isinstance(item[\"\
          content\"][0], dict) else \"\"\n        elif \"text\" in item:\n       \
          \     text_str = item.get(\"text\", \"\")\n        if not text_str:\n  \
          \          continue\n        try:\n            text_json = _to_json(text_str)\n\
          \            if not isinstance(text_json, dict):\n                continue\n\
          \            data_list = text_json.get(\"data\", [])\n            if not\
          \ isinstance(data_list, list) or not data_list:\n                continue\n\
          \            latest = data_list[0]\n            if not isinstance(latest,\
          \ dict):\n                continue\n            fund_code = (latest.get(\"\
          fundCode\") or \"\").strip()\n            if fund_code:\n              \
          \  result[fund_code] = latest\n        except Exception:\n            continue\n\
          \    return result\n\n\ndef _format_fund_asset(asset_value):\n    \"\"\"\
          元 → 亿元，保留 2 位小数；空返回 \"null\"。\"\"\"\n    if asset_value is None or asset_value\
          \ == \"\":\n        return \"null\"\n    try:\n        return f\"{float(asset_value)\
          \ / 100000000:.2f}\"\n    except (TypeError, ValueError):\n        return\
          \ \"null\"\n\n\ndef _format_percentage(value):\n    \"\"\"百分比保留 2 位小数；空返回\
          \ \"null\"。\"\"\"\n    if value is None or value == \"\":\n        return\
          \ \"null\"\n    try:\n        return f\"{float(value):.2f}\"\n    except\
          \ (TypeError, ValueError):\n        return \"null\"\n\n\ndef main(matched_funds,\
          \ fund_technical_data):\n    \"\"\"\n    合并基金持仓占比与技术指标，按占比↓、规模↓排序，取前 1–3\
          \ 只作为同赛道换股推荐。\n    \"\"\"\n    try:\n        matched_list = _ensure_matched_funds_list(matched_funds)\n\
          \        technical_by_code = _parse_fund_technical_output(fund_technical_data)\n\
          \n        merged = []\n        for fund in matched_list:\n            if\
          \ not isinstance(fund, dict):\n                continue\n            fund_code\
          \ = (fund.get(\"fundCode\") or \"\").strip()\n            if not fund_code:\n\
          \                continue\n\n            tech = technical_by_code.get(fund_code,\
          \ {})\n            fund_name = fund.get(\"fundName\", \"\") or \"\"\n  \
          \          industry_name = fund.get(\"industryName\", \"\") or \"\"\n  \
          \          holding_pct = fund.get(\"holdingPercentageAnnualNetAssets\")\n\
          \            fund_asset = tech.get(\"fundAsset\")\n            entry_date\
          \ = fund.get(\"etfEntryDate\", \"\") or \"\"\n\n            holding_fmt\
          \ = _format_percentage(holding_pct)\n            asset_fmt = _format_fund_asset(fund_asset)\n\
          \n            if holding_fmt != \"null\" and asset_fmt != \"null\":\n  \
          \              reason = f\"该基金为策略持仓，重仓{industry_name}行业，持仓占比{holding_fmt}%，基金规模{asset_fmt}亿元，兼具策略持仓、高占比和大规模三重优势\"\
          \n            elif holding_fmt != \"null\":\n                reason = f\"\
          该基金为策略持仓，重仓{industry_name}行业，持仓占比{holding_fmt}%，兼具策略持仓和高占比优势\"\n       \
          \     elif asset_fmt != \"null\":\n                reason = f\"该基金为策略持仓，重仓{industry_name}行业，基金规模{asset_fmt}亿元，兼具策略持仓和大规模优势\"\
          \n            else:\n                reason = f\"该基金为策略持仓，重仓{industry_name}行业，具备配置价值\"\
          \n\n            try:\n                _hold_val = float(holding_pct) if\
          \ holding_pct is not None else 0\n            except (TypeError, ValueError):\n\
          \                _hold_val = 0\n            try:\n                _asset_val\
          \ = float(fund_asset) if fund_asset is not None else 0\n            except\
          \ (TypeError, ValueError):\n                _asset_val = 0\n\n         \
          \   merged.append({\n                \"fundCode\": fund_code,\n        \
          \        \"fundName\": fund_name,\n                \"industryName\": industry_name,\n\
          \                \"etfEntryDate\": entry_date,\n                \"holdingPercentage\"\
          : holding_fmt,\n                \"fundAsset\": asset_fmt,\n            \
          \    \"reason\": reason,\n                \"_holding_percentage_value\"\
          : _hold_val,\n                \"_fund_asset_value\": _asset_val,\n     \
          \       })\n\n        merged.sort(\n            key=lambda x: (x[\"_holding_percentage_value\"\
          ], x[\"_fund_asset_value\"]),\n            reverse=True,\n        )\n  \
          \      top = merged[:3]\n        for f in top:\n            del f[\"_holding_percentage_value\"\
          ]\n            del f[\"_fund_asset_value\"]\n\n        return {\"recommended_funds\"\
          : top}\n\n    except Exception:\n        return {\"recommended_funds\":\
          \ []}\n"
        code_language: python3
