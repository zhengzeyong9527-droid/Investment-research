    - data:
        code: "# Dify 代码节点：波段潜力判断\n# 输入：5 个 String（上游接口完整 JSON）\n#   price_pressure_response\
          \   - 9.74 股票量价与压力支撑指标（PSY）\n#   data_mining_response       - 9.69 行情技术指标(数据挖掘)（价量多重排序）\n\
          #   swing_response             - 9.71 股票摆动与超买超卖指标（KDJ）\n#   composite_score_response\
          \   - 9.28 股票综合得分\n#   industry_rotation_response - 申万一级行业轮动因子（可选，缺则行业项给中性分\
          \ 50）\n# 输出：swing_potential_score (Number 0-100)，has_swing_potential (Number\
          \ 1/0，>65% 为 1)\nimport json\n\n\ndef _to_json(value):\n    if value is\
          \ None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _extract_data_list(api_response):\n   \
          \ \"\"\"解析接口返回中的 data：支持 json[0].data、text 内 data、顶层 data；data 可为 list 或单对象。\"\
          \"\"\n    if not isinstance(api_response, dict):\n        return []\n  \
          \  if api_response.get(\"json\") and isinstance(api_response[\"json\"],\
          \ list) and api_response[\"json\"]:\n        first = api_response[\"json\"\
          ][0]\n        if isinstance(first, dict) and \"data\" in first:\n      \
          \      data = first[\"data\"]\n            if isinstance(data, list) and\
          \ data:\n                return data\n            if isinstance(data, dict):\n\
          \                return [data]\n    if api_response.get(\"text\"):\n   \
          \     parsed = _to_json(api_response[\"text\"])\n        if isinstance(parsed,\
          \ dict) and \"data\" in parsed:\n            data = parsed[\"data\"]\n \
          \           if isinstance(data, list) and data:\n                return\
          \ data\n            if isinstance(data, dict):\n                return [data]\n\
          \    if \"data\" in api_response:\n        data = api_response[\"data\"\
          ]\n        if isinstance(data, list) and data:\n            return data\n\
          \        if isinstance(data, dict):\n            return [data]\n    return\
          \ []\n\n\ndef _safe_float(v, default=None):\n    if v is None:\n       \
          \ return default\n    try:\n        return float(v)\n    except (TypeError,\
          \ ValueError):\n        return default\n\n\ndef _score_psy(record):\n  \
          \  \"\"\"PSY 0-100，直接用。\"\"\"\n    v = _safe_float(record.get(\"psy\"))\n\
          \    if v is None:\n        return None\n    return max(0.0, min(100.0,\
          \ v))\n\n\ndef _score_kdj(record):\n    \"\"\"KDJ 取 (K+D+J)/3 作为 0-100。\"\
          \"\"\n    k = _safe_float(record.get(\"kdjK\"))\n    d = _safe_float(record.get(\"\
          kdjD\"))\n    j = _safe_float(record.get(\"kdjJ\"))\n    if k is None and\
          \ d is None and j is None:\n        return None\n    vals = [x for x in\
          \ (k, d, j) if x is not None]\n    if not vals:\n        return None\n \
          \   avg = sum(vals) / len(vals)\n    return max(0.0, min(100.0, avg))\n\n\
          \ndef _score_price_volume_multi_rank(record):\n    \"\"\"价量多重排序约 [-1,1]，映射到\
          \ 0-100。\"\"\"\n    v = _safe_float(record.get(\"priceVolumeMultiRank\"\
          ))\n    if v is None:\n        return None\n    # (v + 1) / 2 * 100，截断\n\
          \    s = (v + 1.0) / 2.0 * 100.0\n    return max(0.0, min(100.0, s))\n\n\
          \ndef _score_composite(record):\n    \"\"\"综合得分 score 或 skillScore，字符串转\
          \ float，0-100。\"\"\"\n    v = record.get(\"score\") or record.get(\"skillScore\"\
          )\n    if v is None:\n        return None\n    f = _safe_float(v)\n    if\
          \ f is None:\n        return None\n    return max(0.0, min(100.0, f))\n\n\
          \ndef _score_industry_rotation(industry_rotation_response, stock_industry_code_l1):\n\
          \    \"\"\"\n    申万一级行业轮动因子：data 为列表，每条含 industryCode、date、hlStyleCorrXMomentum、marketSentiment。\n\
          \    用 industryCode 与个股申万一级 idu4Lv1Id 匹配，取该行业最新日期的动量与市场温度，归一化到 0-100。\n\
          \    缺数据或无法解析时返回中性 50。\n    \"\"\"\n    if not industry_rotation_response\
          \ or not str(industry_rotation_response).strip():\n        return 50.0\n\
          \    parsed = _to_json(industry_rotation_response)\n    if not isinstance(parsed,\
          \ dict):\n        return 50.0\n    data_list = _extract_data_list(parsed)\n\
          \    if not data_list and \"data\" in parsed and isinstance(parsed[\"data\"\
          ], list):\n        data_list = parsed[\"data\"]\n    if not data_list:\n\
          \        return 50.0\n    code_l1 = (stock_industry_code_l1 or \"\").strip()\n\
          \    # 只保留该申万一级行业的记录\n    same_industry = [r for r in data_list if isinstance(r,\
          \ dict) and str(r.get(\"industryCode\") or \"\").strip() == code_l1]\n \
          \   if not same_industry:\n        return 50.0\n    # 按 date 降序取最新一条（接口通常已按日期排序，第一条即最新）\n\
          \    same_industry.sort(key=lambda x: (x.get(\"date\") or \"\"), reverse=True)\n\
          \    latest = same_industry[0]\n    momentum = _safe_float(latest.get(\"\
          hlStyleCorrXMomentum\"))\n    sentiment = _safe_float(latest.get(\"marketSentiment\"\
          ))\n    # 二者均在 0~1，取平均后映射到 0-100\n    if momentum is not None and sentiment\
          \ is not None:\n        s = (momentum + sentiment) / 2.0 * 100.0\n    elif\
          \ momentum is not None:\n        s = momentum * 100.0\n    elif sentiment\
          \ is not None:\n        s = sentiment * 100.0\n    else:\n        return\
          \ 50.0\n    return max(0.0, min(100.0, s))\n\n\ndef main(\n    price_pressure_response,\n\
          \    data_mining_response,\n    swing_response,\n    composite_score_response,\n\
          \    industry_rotation_response,\n):\n    \"\"\"\n    波段潜力加权得分，>65% 判定为有波段潜力。\n\
          \    权重：PSY 0.2, KDJ 0.2, 价量多重排序 0.2, 综合得分 0.2, 行业轮动 0.2。\n    \"\"\"\n\
          \    weights = {\n        \"psy\": 0.2,\n        \"kdj\": 0.2,\n       \
          \ \"price_volume\": 0.2,\n        \"composite\": 0.2,\n        \"industry\"\
          : 0.2,\n    }\n    scores = {}\n    total_weight_used = 0.0\n    weighted_sum\
          \ = 0.0\n\n    # 9.74 PSY：取最新一条\n    api = _to_json(price_pressure_response)\n\
          \    data_list = _extract_data_list(api or {})\n    if data_list and isinstance(data_list[0],\
          \ dict):\n        s = _score_psy(data_list[0])\n        if s is not None:\n\
          \            scores[\"psy\"] = s\n            weighted_sum += weights[\"\
          psy\"] * s\n            total_weight_used += weights[\"psy\"]\n\n    # 9.69\
          \ 价量多重排序：取最新一条\n    api = _to_json(data_mining_response)\n    data_list\
          \ = _extract_data_list(api or {})\n    if data_list and isinstance(data_list[0],\
          \ dict):\n        s = _score_price_volume_multi_rank(data_list[0])\n   \
          \     if s is not None:\n            scores[\"price_volume\"] = s\n    \
          \        weighted_sum += weights[\"price_volume\"] * s\n            total_weight_used\
          \ += weights[\"price_volume\"]\n\n    # 9.71 KDJ：取最新一条\n    api = _to_json(swing_response)\n\
          \    data_list = _extract_data_list(api or {})\n    if data_list and isinstance(data_list[0],\
          \ dict):\n        s = _score_kdj(data_list[0])\n        if s is not None:\n\
          \            scores[\"kdj\"] = s\n            weighted_sum += weights[\"\
          kdj\"] * s\n            total_weight_used += weights[\"kdj\"]\n\n    # 9.28\
          \ 综合得分：data 为单对象，并取申万一级行业代码供行业轮动匹配\n    api = _to_json(composite_score_response)\n\
          \    data_list = _extract_data_list(api or {})\n    stock_industry_l1 =\
          \ None\n    if data_list and isinstance(data_list[0], dict):\n        r\
          \ = data_list[0]\n        stock_industry_l1 = r.get(\"idu4Lv1Id\")\n   \
          \     s = _score_composite(r)\n        if s is not None:\n            scores[\"\
          composite\"] = s\n            weighted_sum += weights[\"composite\"] * s\n\
          \            total_weight_used += weights[\"composite\"]\n\n    # 申万一级行业轮动因子（可选）：按\
          \ industryCode 匹配，取最新日期的动量+市场温度归一化 0-100\n    s_industry = _score_industry_rotation(industry_rotation_response,\
          \ stock_industry_l1)\n    scores[\"industry\"] = s_industry\n    weighted_sum\
          \ += weights[\"industry\"] * s_industry\n    total_weight_used += weights[\"\
          industry\"]\n\n    if total_weight_used <= 0:\n        swing_potential_score\
          \ = 0.0\n    else:\n        swing_potential_score = weighted_sum / total_weight_used\n\
          \    swing_potential_score = round(min(100.0, max(0.0, swing_potential_score)),\
          \ 2)\n    has_swing_potential = 1 if swing_potential_score > 65 else 0\n\
          \n    return {\n        \"swing_potential_score\": swing_potential_score,\n\
          \        \"has_swing_potential\": has_swing_potential,\n    }\n"
        code_language: python3
        outputs:
          has_swing_potential:
            children: null
            type: number
          swing_potential_score:
            children: null
            type: number
        selected: false
        title: 判断波段潜力
        type: code
        variables:
