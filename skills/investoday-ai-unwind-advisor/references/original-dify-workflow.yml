    - data:
        code: "# Dify 代码节点：赛道潜力判断（申万一级行业）\n# 输入：\n#   stock_industry_return_response\
          \ - 9.5 股票及所属申万行业区间涨幅（完整 JSON）\n#   index_return_response         - 2.1\
          \ 指数区间涨幅（沪深300，完整 JSON）\n#   etf_recommend_response        - ETF轮动推荐赛道接口返回（完整\
          \ JSON）\n# 输出：\n#   sector_beats_stock_count   - 赛道跑赢个股的区间数（0~5）\n#   sector_beats_index_count\
          \   - 赛道跑赢沪深300的区间数（0~5）\n#   sector_positive_count      - 赛道收益为正的区间数（0~5）\n\
          #   sector_has_more_potential  - string：\"赛道相较个股更有潜力\" | \"赛道相较个股无明显超额收益\"\
          \ | \"\"\n\nimport json\n\nPERIODS = [\n    (\"1w\", \"return1wPct\", \"\
          industryL1Return1wPct\"),\n    (\"1m\", \"return1mPct\", \"industryL1Return1mPct\"\
          ),\n    (\"3m\", \"return3mPct\", \"industryL1Return3mPct\"),\n    (\"6m\"\
          , \"return6mPct\", \"industryL1Return6mPct\"),\n    (\"1y\", \"return1yPct\"\
          , \"industryL1Return1yPct\"),\n]\n\n\ndef _to_json(value):\n    if value\
          \ is None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _extract_data_list(api_response):\n   \
          \ \"\"\"解析接口返回中的 data：支持 json[0].data、text 内 data、顶层 data。\"\"\"\n    if\
          \ not isinstance(api_response, dict):\n        return []\n    if api_response.get(\"\
          json\") and isinstance(api_response[\"json\"], list) and api_response[\"\
          json\"]:\n        first = api_response[\"json\"][0]\n        if isinstance(first,\
          \ dict) and \"data\" in first:\n            data = first[\"data\"]\n   \
          \         if isinstance(data, list) and data:\n                return data\n\
          \            if isinstance(data, dict):\n                return [data]\n\
          \    if api_response.get(\"text\"):\n        parsed = _to_json(api_response[\"\
          text\"])\n        if isinstance(parsed, dict) and \"data\" in parsed:\n\
          \            data = parsed[\"data\"]\n            if isinstance(data, list)\
          \ and data:\n                return data\n            if isinstance(data,\
          \ dict):\n                return [data]\n    if \"data\" in api_response:\n\
          \        data = api_response[\"data\"]\n        if isinstance(data, list)\
          \ and data:\n            return data\n        if isinstance(data, dict):\n\
          \            return [data]\n    return []\n\n\ndef _etf_recommend_l1_codes(etf_response):\n\
          \    \"\"\"从 ETF 轮动推荐赛道返回中解析出推荐赛道的申万一级行业代码集合（前 2 位）。\"\"\"\n    data_list\
          \ = _extract_data_list(_to_json(etf_response) or {})\n    codes = set()\n\
          \    for item in data_list:\n        if not isinstance(item, dict):\n  \
          \          continue\n        code = item.get(\"industryCode\") or item.get(\"\
          industry_code\") or \"\"\n        if isinstance(code, str) and len(code)\
          \ >= 2:\n            codes.add(code[:2])\n    return codes\n\n\ndef _stock_l1_code(record):\n\
          \    \"\"\"从 9.5 单条记录中取申万一级行业代码（2 位）。\"\"\"\n    code = (record.get(\"industryCodeSwL1\"\
          ) or record.get(\"industry_code_sw_l1\") or \"\").strip()\n    if not code:\n\
          \        return \"\"\n    return code[:2] if len(code) >= 2 else code\n\n\
          \ndef _safe_float(v, default=None):\n    if v is None:\n        return default\n\
          \    try:\n        return float(v)\n    except (TypeError, ValueError):\n\
          \        return default\n\n\ndef main(stock_industry_return_response, index_return_response,\
          \ etf_recommend_response):\n    \"\"\"\n    判断赛道相较个股是否有潜力。\n    输出 sector_has_more_potential（string）：\n\
          \      - \"赛道相较个股更有潜力\"：三项均>=3\n      - \"赛道相较个股无明显超额收益\"：不满足上一条件但属于 ETF\
          \ 轮动推荐赛道\n      - \"\"：否则\n    \"\"\"\n    sector_beats_stock_count = 0\n\
          \    sector_beats_index_count = 0\n    sector_positive_count = 0\n    empty_result\
          \ = {\n        \"sector_beats_stock_count\": 0,\n        \"sector_beats_index_count\"\
          : 0,\n        \"sector_positive_count\": 0,\n        \"sector_has_more_potential\"\
          : \"\",\n    }\n\n    stock_industry_data = _extract_data_list(_to_json(stock_industry_return_response)\
          \ or {})\n    stock_industry = stock_industry_data[0] if stock_industry_data\
          \ and isinstance(stock_industry_data[0], dict) else None\n\n    if not stock_industry:\n\
          \        return empty_result\n\n    index_data = _extract_data_list(_to_json(index_return_response)\
          \ or {})\n    index_record = index_data[0] if index_data and isinstance(index_data[0],\
          \ dict) else None\n\n    for _period_key, stock_key, industry_key in PERIODS:\n\
          \        industry_ret = _safe_float(stock_industry.get(industry_key))\n\
          \        stock_ret = _safe_float(stock_industry.get(stock_key))\n      \
          \  index_ret = _safe_float(index_record.get(stock_key)) if index_record\
          \ else None\n\n        if industry_ret is not None and stock_ret is not\
          \ None and industry_ret > stock_ret:\n            sector_beats_stock_count\
          \ += 1\n        if industry_ret is not None and index_ret is not None and\
          \ industry_ret > index_ret:\n            sector_beats_index_count += 1\n\
          \        if industry_ret is not None and industry_ret > 0:\n           \
          \ sector_positive_count += 1\n\n    has_more = (\n        sector_beats_stock_count\
          \ >= 3\n        and sector_beats_index_count >= 3\n        and sector_positive_count\
          \ >= 3\n    )\n    etf_l1_set = _etf_recommend_l1_codes(etf_recommend_response)\n\
          \    stock_l1 = _stock_l1_code(stock_industry)\n    in_etf = stock_l1 in\
          \ etf_l1_set if etf_l1_set and stock_l1 else False\n\n    if has_more:\n\
          \        sector_has_more_potential = \"赛道相较个股更有潜力\"\n    elif in_etf:\n\
          \        sector_has_more_potential = \"赛道相较个股无明显超额收益\"\n    else:\n    \
          \    sector_has_more_potential = \"赛道潜力不高\"\n\n    return {\n        \"\
          sector_beats_stock_count\": sector_beats_stock_count,\n        \"sector_beats_index_count\"\
          : sector_beats_index_count,\n        \"sector_positive_count\": sector_positive_count,\n\
          \        \"sector_has_more_potential\": sector_has_more_potential,\n   \
          \ }\n"
        code_language: python3
        outputs:
          sector_beats_index_count:
            children: null
            type: number
          sector_beats_stock_count:
            children: null
            type: number
          sector_has_more_potential:
            children: null
            type: string
          sector_positive_count:
            children: null
            type: number
        selected: false
        title: 判断赛道潜力
