            当解套方案中存在波段策略且**当前有信号**时，本段需结合技术指标给出**较详细的波段策略**，包含：

            - **当前操作建议**：结合技术指标说明当前技术面依据（如超卖反弹、支撑位、金叉等），并给出具体的参考买入时机、参考卖出/止盈时机（可写价格区间或触发条件）、止损参考，以及分批建议、持仓周期参考。

            - **历史战绩**：若有历史波段表现数据，则用 1～3 句概括（如近若干月信号次数、胜率、累计收益率、平均持仓天数等）；无历史数据时不展示本段。

            当**当前无信号**时：先明确提示「目前处于观望期」及简要原因（如暂无波段信号、技术面待观察等），再若有历史战绩数据则展示历史战绩，无历史数据则不展示。



            ---



            # 换股策略（或 换股策略（备选方案））

            **标题规则**：若本方案中换股为**备选**，本章节标题**必须**为「# 换股策略（备选方案）」；若换股为**主推**，标题为「# 换股策略」。

            根据「解套方案2（换股策略）：{{strategy_data}}」内容输出本段。若 strategy_data 中含有 ETF 轮动策略推荐的赛道
            ETF（含代码、名称、选股/换股理由），则必须按下列格式列出 1～5 只备选 ETF 及换股理由；若没有或为空，需用**用户可理解的自然语言**说明「本次暂无合适的ETF备选/换股标的建议」并给出**1～2
            句原因**（如当前轮动未覆盖该行业、筛选条件下暂无流动性/规模合适标的、当前阶段更适合先以波段/风控为主等），避免技术化或系统提示口吻。**禁止**出现类似「当前虽无明确ETF推荐代码」「当前无具体ETF轮动策略推荐数据」「暂无ETF代码/数据」等机器化表达。

            - 格式要求：每只 ETF 一行，写清「代码 + 名称」及「换股理由」（可直接提炼或缩写上游给出的选股理由，保持 1～3 句）。

            - 示例：

              1. **512400 有色金属ETF**：换股理由：……  

              2. **515210 钢铁ETF**：换股理由：……




            其他要求：

            - **策略展示**：解套可行性之后必须先写主推策略章节、再写备选策略章节；备选策略的章节标题必须包含「（备选方案）」。

            - 仅限基于输入的内容进行总结，不要引用任何额外的外部数据，不要给出没有数据支撑或不确定的表述。

