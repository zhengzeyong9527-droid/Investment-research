    - data:
        code: "# Dify 代码节点：技术面解读\n# 输入：4 个 String（上游接口完整 JSON）\n#   price_pressure_response\
          \   - 9.74 股票量价与压力支撑（PSY、布林带、MFI、AR/BR 等）\n#   data_mining_response    \
          \   - 9.69 行情技术指标(数据挖掘)（价量多重排序、收盘收益等）\n#   swing_response             -\
          \ 9.71 股票摆动与超买超卖（KDJ、RSI、BIAS、ATR 等）\n#   composite_score_response   - 9.28\
          \ 股票综合得分\n# 输出：technical_interpretation (String)、technical_indicators (Object，可选)\
          \ — 解析后的技术指标供 LLM 使用\nimport json\n\n\ndef _to_json(value):\n    if value\
          \ is None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _extract_data_list(api_response):\n   \
          \ \"\"\"解析接口返回中的 data：支持 json[0].data、text 内 data、顶层 data；data 可为 list 或单对象。\"\
          \"\"\n    if not isinstance(api_response, dict):\n        return []\n  \
          \  if api_response.get(\"json\") and isinstance(api_response[\"json\"],\
          \ list) and api_response[\"json\"]:\n        first = api_response[\"json\"\
          ][0]\n        if isinstance(first, dict) and \"data\" in first:\n      \
          \      data = first[\"data\"]\n            if isinstance(data, list) and\
          \ data:\n                return data\n            if isinstance(data, dict):\n\
          \                return [data]\n    if api_response.get(\"text\"):\n   \
          \     parsed = _to_json(api_response[\"text\"])\n        if isinstance(parsed,\
          \ dict) and \"data\" in parsed:\n            data = parsed[\"data\"]\n \
          \           if isinstance(data, list) and data:\n                return\
          \ data\n            if isinstance(data, dict):\n                return [data]\n\
          \    if \"data\" in api_response:\n        data = api_response[\"data\"\
          ]\n        if isinstance(data, list) and data:\n            return data\n\
          \        if isinstance(data, dict):\n            return [data]\n    return\
          \ []\n\n\ndef _safe_float(v, default=None):\n    if v is None:\n       \
          \ return default\n    try:\n        return float(v)\n    except (TypeError,\
          \ ValueError):\n        return default\n\n\ndef _label_0_100(score, low=25,\
          \ high=75, labels=(\"偏空\", \"中性\", \"偏多\")):\n    \"\"\"将 0-100 得分映射为三档标签。\"\
          \"\"\n    if score is None:\n        return None\n    if score <= low:\n\
          \        return labels[0]\n    if score >= high:\n        return labels[2]\n\
          \    return labels[1]\n\n\ndef _get_psy_value(record):\n    v = _safe_float(record.get(\"\
          psy\"))\n    if v is None:\n        return None\n    return max(0.0, min(100.0,\
          \ v))\n\n\ndef _get_kdj_values(record):\n    \"\"\"返回 (K, D, J) 及平均值的归一化\
          \ 0-100。J 用于超买超卖判断。\"\"\"\n    k = _safe_float(record.get(\"kdjK\"))\n \
          \   d = _safe_float(record.get(\"kdjD\"))\n    j = _safe_float(record.get(\"\
          kdjJ\"))\n    if k is None and d is None and j is None:\n        return\
          \ None, None, None, None\n    vals = [x for x in (k, d, j) if x is not None]\n\
          \    avg = sum(vals) / len(vals) if vals else None\n    if avg is not None:\n\
          \        avg = max(0.0, min(100.0, avg))\n    return k, d, j, avg\n\n\n\
          def _label_kdj(j_val, avg_val):\n    \"\"\"KDJ 状态：优先用 J 判断超买超卖，否则用平均值给偏多/中性/偏空。\"\
          \"\"\n    if j_val is not None:\n        if j_val >= 80:\n            return\
          \ \"超买\"\n        if j_val <= 20:\n            return \"超卖\"\n    if avg_val\
          \ is not None:\n        return _label_0_100(avg_val, 25, 75, (\"偏空\", \"\
          中性\", \"偏多\"))\n    return None\n\n\ndef _get_price_volume_rank(record):\n\
          \    v = _safe_float(record.get(\"priceVolumeMultiRank\"))\n    if v is\
          \ None:\n        return None\n    # 约 [-1, 1] 映射到 0-100\n    s = (v + 1.0)\
          \ / 2.0 * 100.0\n    return max(0.0, min(100.0, s))\n\n\ndef _get_composite_score(record):\n\
          \    v = record.get(\"score\") or record.get(\"skillScore\")\n    if v is\
          \ None:\n        return None\n    f = _safe_float(v)\n    if f is None:\n\
          \        return None\n    return max(0.0, min(100.0, f))\n\n\ndef _get_latest_record(api_response):\n\
          \    \"\"\"从接口响应中取最新一条记录（列表取第一条，单对象包装成列表后取第一条）。\"\"\"\n    data_list = _extract_data_list(api_response\
          \ if isinstance(api_response, dict) else {})\n    if not data_list or not\
          \ isinstance(data_list[0], dict):\n        return None\n    return data_list[0]\n\
          \n\ndef _get_rsi_label(rsi_val):\n    \"\"\"RSI 超买超卖：<30 超卖，>70 超买，30-70\
          \ 中性偏多/偏空。\"\"\"\n    if rsi_val is None:\n        return None\n    if rsi_val\
          \ <= 30:\n        return \"超卖\"\n    if rsi_val >= 70:\n        return \"\
          超买\"\n    if rsi_val >= 50:\n        return \"中性偏多\"\n    return \"中性偏空\"\
          \n\n\ndef _get_bias_label(bias_val):\n    \"\"\"乖离率：正为偏多、负为偏空，绝对值过大可提示超买/超卖。\"\
          \"\"\n    if bias_val is None:\n        return None\n    if bias_val >=\
          \ 3:\n        return \"偏多(乖离较大)\"\n    if bias_val <= -3:\n        return\
          \ \"偏空(乖离较大)\"\n    if bias_val >= 0:\n        return \"偏多\"\n    return\
          \ \"偏空\"\n\n\ndef _get_mfi_label(mfi_val):\n    \"\"\"MFI 资金流量：<20 超卖，>80\
          \ 超买。\"\"\"\n    if mfi_val is None:\n        return None\n    if mfi_val\
          \ <= 20:\n        return \"超卖\"\n    if mfi_val >= 80:\n        return \"\
          超买\"\n    return \"中性\"\n\n\ndef _get_arbr_label(ar_val, br_val):\n    \"\
          \"\"AR/BR 人气意愿：AR<100 人气弱，BR 配合看意愿。\"\"\"\n    if ar_val is None and br_val\
          \ is None:\n        return None\n    ar = _safe_float(ar_val)\n    br =\
          \ _safe_float(br_val)\n    if ar is not None:\n        if ar < 80:\n   \
          \         return \"人气偏弱\"\n        if ar > 150:\n            return \"人气偏强\"\
          \n    if br is not None:\n        if br < 80:\n            return \"意愿偏弱\"\
          \n        if br > 150:\n            return \"意愿偏强\"\n    return \"中性\"\n\
          \n\ndef main(\n    price_pressure_response,\n    data_mining_response,\n\
          \    swing_response,\n    composite_score_response,\n):\n    \"\"\"\n  \
          \  从 4 个指标接口解析最新一条记录，得到各指标数值并转为状态标签，\n    拼成一段技术面解读文案；同时输出结构化指标供 LLM 引用（买卖时机、支撑阻力等）。\n\
          \    \"\"\"\n    parts = []\n    indicators = {}  # 结构化指标，供下游 LLM 直接引用\n\
          \n    # --- price_pressure：PSY、布林带、MFI、AR/BR ---\n    api_pp = _to_json(price_pressure_response)\n\
          \    rec_pp = _get_latest_record(api_pp or {})\n\n    psy_val = _get_psy_value(rec_pp)\
          \ if rec_pp else None\n    if psy_val is not None:\n        psy_label =\
          \ _label_0_100(psy_val, 25, 75, (\"偏空\", \"中性\", \"偏多\"))\n        parts.append(\"\
          量价与压力支撑(PSY){}（数值{:.1f}）\".format(psy_label, psy_val))\n        indicators[\"\
          psy\"] = round(psy_val, 2)\n    else:\n        parts.append(\"量价与压力支撑(PSY)暂无有效值\"\
          )\n\n    # 布林带（支撑/阻力参考）\n    boll_mid = _safe_float(rec_pp.get(\"bollMid\"\
          )) if rec_pp else None\n    boll_upper = _safe_float(rec_pp.get(\"bollUpper\"\
          )) if rec_pp else None\n    boll_lower = _safe_float(rec_pp.get(\"bollLower\"\
          )) if rec_pp else None\n    if boll_upper is not None and boll_lower is\
          \ not None:\n        indicators[\"boll_upper\"] = round(boll_upper, 4)\n\
          \        indicators[\"boll_lower\"] = round(boll_lower, 4)\n        if boll_mid\
          \ is not None:\n            indicators[\"boll_mid\"] = round(boll_mid, 4)\n\
          \        parts.append(\"布林带上下轨约{:.2f}～{:.2f}\".format(boll_lower, boll_upper))\n\
          \n    # MFI 资金流量\n    mfi_val = _safe_float(rec_pp.get(\"mfi\")) if rec_pp\
          \ else None\n    if mfi_val is not None:\n        mfi_label = _get_mfi_label(mfi_val)\n\
          \        parts.append(\"资金流量(MFI){}（数值{:.1f}）\".format(mfi_label, mfi_val))\n\
          \        indicators[\"mfi\"] = round(mfi_val, 2)\n\n    # AR/BR 人气意愿\n \
          \   ar_val = _safe_float(rec_pp.get(\"ar\")) if rec_pp else None\n    br_val\
          \ = _safe_float(rec_pp.get(\"br\")) if rec_pp else None\n    if ar_val is\
          \ not None or br_val is not None:\n        arbr_label = _get_arbr_label(ar_val,\
          \ br_val) or \"中性\"\n        parts.append(\"人气意愿(AR/BR){}（AR{:.1f} BR{:.1f}）\"\
          .format(\n            arbr_label, ar_val or 0, br_val or 0))\n        if\
          \ ar_val is not None:\n            indicators[\"ar\"] = round(ar_val, 2)\n\
          \        if br_val is not None:\n            indicators[\"br\"] = round(br_val,\
          \ 2)\n\n    # --- data_mining：价量多重排序 ---\n    api_dm = _to_json(data_mining_response)\n\
          \    rec_dm = _get_latest_record(api_dm or {})\n    pv_val = _get_price_volume_rank(rec_dm)\
          \ if rec_dm else None\n    if pv_val is not None:\n        pv_label = _label_0_100(pv_val,\
          \ 30, 70, (\"偏弱\", \"中性\", \"偏强\"))\n        parts.append(\"价量多重排序{}（数值{:.1f}）\"\
          .format(pv_label, pv_val))\n        indicators[\"price_volume_rank\"] =\
          \ round(pv_val, 2)\n    else:\n        parts.append(\"价量多重排序暂无有效值\")\n\n\
          \    # --- swing：KDJ、RSI、BIAS、ATR ---\n    api_sw = _to_json(swing_response)\n\
          \    rec_sw = _get_latest_record(api_sw or {})\n\n    kdj_k, kdj_d, kdj_j,\
          \ kdj_avg = _get_kdj_values(rec_sw) if rec_sw else (None, None, None, None)\n\
          \    kdj_label = _label_kdj(kdj_j, kdj_avg)\n    if kdj_label is not None:\n\
          \        j_str = \"（J值{:.1f}）\".format(kdj_j) if kdj_j is not None else\
          \ \"\"\n        parts.append(\"摆动与超买超卖(KDJ){}{}\".format(kdj_label, j_str))\n\
          \        indicators[\"kdj_k\"], indicators[\"kdj_d\"], indicators[\"kdj_j\"\
          ] = kdj_k, kdj_d, kdj_j\n    else:\n        parts.append(\"摆动与超买超卖(KDJ)暂无有效值\"\
          )\n\n    # RSI\n    rsi14 = _safe_float(rec_sw.get(\"rsi14d\")) if rec_sw\
          \ else None\n    rsi5 = _safe_float(rec_sw.get(\"rsi5d\")) if rec_sw else\
          \ None\n    rsi_val = rsi14 if rsi14 is not None else rsi5\n    if rsi_val\
          \ is not None:\n        rsi_label = _get_rsi_label(rsi_val)\n        parts.append(\"\
          相对强弱(RSI){}（{:.1f}）\".format(rsi_label, rsi_val))\n        indicators[\"\
          rsi14d\"] = round(rsi14, 2) if rsi14 is not None else None\n        indicators[\"\
          rsi5d\"] = round(rsi5, 2) if rsi5 is not None else None\n\n    # BIAS 乖离率\n\
          \    bias_val = _safe_float(rec_sw.get(\"bias\")) or _safe_float(rec_sw.get(\"\
          bias6d\")) if rec_sw else None\n    if bias_val is not None:\n        bias_label\
          \ = _get_bias_label(bias_val)\n        parts.append(\"乖离率(BIAS){}{:.2f}%\"\
          .format(bias_label, bias_val))\n        indicators[\"bias\"] = round(bias_val,\
          \ 4)\n\n    # ATR 真实波幅（波动率参考，供买卖时机用）\n    atr_val = _safe_float(rec_sw.get(\"\
          atr\")) if rec_sw else None\n    if atr_val is not None:\n        indicators[\"\
          atr\"] = round(atr_val, 4)\n\n    # --- composite_score ---\n    api_cs\
          \ = _to_json(composite_score_response)\n    rec_cs = _get_latest_record(api_cs\
          \ or {})\n    composite_val = _get_composite_score(rec_cs) if rec_cs else\
          \ None\n    if composite_val is not None:\n        comp_label = _label_0_100(composite_val,\
          \ 40, 60, (\"偏弱\", \"中性\", \"偏强\"))\n        parts.append(\"综合得分{}（数值{:.1f}）\"\
          .format(comp_label, composite_val))\n        indicators[\"composite_score\"\
          ] = round(composite_val, 2)\n    else:\n        parts.append(\"综合得分暂无有效值\"\
          )\n\n    # 综合结论\n    conclusion = \"中性\"\n    if kdj_label == \"超买\":\n\
          \        conclusion = \"短期超买，需防回调\"\n    elif kdj_label == \"超卖\":\n   \
          \     conclusion = \"短期超卖，可关注反弹机会\"\n    else:\n        non_null = [x for\
          \ x in [psy_val, pv_val, composite_val] if x is not None]\n        if non_null:\n\
          \            avg_all = sum(non_null) / len(non_null)\n            if avg_all\
          \ >= 65:\n                conclusion = \"技术面偏多\"\n            elif avg_all\
          \ <= 35:\n                conclusion = \"技术面偏空\"\n    indicators[\"conclusion\"\
          ] = conclusion\n\n    summary = \"；\".join(parts) + \"。综合结论：{}。\".format(conclusion)\n\
          \    technical_interpretation = summary.strip()\n\n    # Dify 代码节点输出若定义为\
          \ string，则需传字符串；将 indicators 转为 JSON 字符串\n    technical_indicators_str =\
          \ json.dumps(indicators, ensure_ascii=False)\n\n    return {\n        \"\
          technical_interpretation\": technical_interpretation,\n        \"technical_indicators\"\
          : technical_indicators_str,\n    }\n"
        code_language: python3
        outputs:
          technical_indicators:
            children: null
            type: string
          technical_interpretation:
            children: null
            type: string
        selected: false
        title: 技术面解读
        type: code
