    - data:
        code: "# Dify 代码节点：ETF 轮动换股建议生成\n# 输入变量：\n# - etf_rotation_data（String 或 Object\
          \ 或 List）：ETF 轮动策略数据\n# - etf_reason_data（List 或 Object）：ETF 入选理由汇总（循环节点\
          \ output 数组）\n# 输出变量：etf_recommendations（String，格式化文本，对 LLM 友好）\n\nimport\
          \ json\nfrom datetime import datetime\n\n\ndef _to_json(value):\n    if\
          \ value is None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _parse_rotation_input(etf_rotation_data):\n\
          \    \"\"\"解析 ETF 轮动输入为 dict（含 data 列表）或 None。\"\"\"\n    if not etf_rotation_data:\n\
          \        return None\n    if isinstance(etf_rotation_data, list):\n    \
          \    if not etf_rotation_data:\n            return None\n        first =\
          \ etf_rotation_data[0]\n        if isinstance(first, dict):\n          \
          \  if first.get(\"text\"):\n                return _to_json(first.get(\"\
          text\"))\n            if first.get(\"json\") and isinstance(first[\"json\"\
          ], list) and first[\"json\"]:\n                c = first[\"json\"][0]\n\
          \                return c if isinstance(c, dict) else None\n           \
          \ return first\n        if isinstance(first, str):\n            return _to_json(first)\n\
          \        return None\n    if isinstance(etf_rotation_data, str):\n     \
          \   return _to_json(etf_rotation_data)\n    if isinstance(etf_rotation_data,\
          \ dict):\n        if etf_rotation_data.get(\"text\"):\n            return\
          \ _to_json(etf_rotation_data.get(\"text\"))\n        if etf_rotation_data.get(\"\
          json\") and isinstance(etf_rotation_data[\"json\"], list) and etf_rotation_data[\"\
          json\"]:\n            c = etf_rotation_data[\"json\"][0]\n            return\
          \ c if isinstance(c, dict) else None\n        return etf_rotation_data\n\
          \    return None\n\n\ndef _parse_etf_reasons(reason_input):\n    \"\"\"\
          解析 ETF 入选理由：循环输出数组 → {etf_code: reason}。\n    支持两种结构：\n    1) item[\"data\"\
          ][\"output\"] 为 [{etf_code, reason}, ...]\n    2) item[\"content\"][0][\"\
          text\"] 为 JSON 字符串，含 output 数组\n    \"\"\"\n    result = {}\n    if not\
          \ reason_input or not isinstance(reason_input, list):\n        return result\n\
          \    for item in reason_input:\n        if not isinstance(item, dict):\n\
          \            continue\n        # 结构1：data.output（示例输入中的格式）\n        data_obj\
          \ = item.get(\"data\")\n        if isinstance(data_obj, dict):\n       \
          \     output_array = data_obj.get(\"output\", [])\n            if isinstance(output_array,\
          \ list):\n                for reason_obj in output_array:\n            \
          \        if not isinstance(reason_obj, dict):\n                        continue\n\
          \                    etf_code = (reason_obj.get(\"etf_code\") or \"\").strip()\n\
          \                    reason = (reason_obj.get(\"reason\") or \"\").strip()\n\
          \                    if etf_code and reason:\n                        result[etf_code]\
          \ = reason\n                continue\n        # 结构2：content[0].text 为 JSON\n\
          \        content_list = item.get(\"content\", [])\n        if not content_list\
          \ or not isinstance(content_list, list):\n            continue\n       \
          \ first_content = content_list[0] if isinstance(content_list[0], dict) else\
          \ None\n        if not first_content:\n            continue\n        text_str\
          \ = first_content.get(\"text\", \"\") or \"\"\n        if not text_str:\n\
          \            continue\n        try:\n            text_json = _to_json(text_str)\n\
          \            if not isinstance(text_json, dict):\n                continue\n\
          \            output_array = text_json.get(\"output\", [])\n            if\
          \ not isinstance(output_array, list):\n                continue\n      \
          \      for reason_obj in output_array:\n                if not isinstance(reason_obj,\
          \ dict):\n                    continue\n                etf_code = (reason_obj.get(\"\
          etf_code\") or \"\").strip()\n                reason = (reason_obj.get(\"\
          reason\") or \"\").strip()\n                if etf_code and reason:\n  \
          \                  result[etf_code] = reason\n        except Exception:\n\
          \            continue\n    return result\n\n\ndef _format_date(date_str):\n\
          \    \"\"\"'2026-01-05 00:00:00' → '2026-01-05'；空 → 'null'。\"\"\"\n    if\
          \ not date_str:\n        return \"null\"\n    if not isinstance(date_str,\
          \ str):\n        date_str = str(date_str)\n    s = date_str.strip()\n  \
          \  if not s or s.lower() == \"null\":\n        return \"null\"\n    return\
          \ s.split()[0] if s else \"null\"\n\n\ndef _holding_days(entry_date_str,\
          \ current_date_str):\n    \"\"\"计算持仓天数；异常返回 None。\"\"\"\n    if not entry_date_str:\n\
          \        return None\n    try:\n        part = (entry_date_str if isinstance(entry_date_str,\
          \ str) else str(entry_date_str)).strip().split()[0]\n        entry = datetime.strptime(part,\
          \ \"%Y-%m-%d\")\n        current = datetime.strptime(current_date_str, \"\
          %Y-%m-%d\")\n        return (current - entry).days\n    except Exception:\n\
          \        return None\n\n\ndef main(etf_rotation_data, etf_reason_data):\n\
          \    \"\"\"\n    从 ETF 轮动数据中筛出仍在持仓的 ETF，按入选时间倒序，拼接选股理由，生成结构化换股建议文本。\n  \
          \  \"\"\"\n    try:\n        current_date_str = datetime.now().strftime(\"\
          %Y-%m-%d\")\n        parsed = _parse_rotation_input(etf_rotation_data)\n\
          \        if not parsed or not isinstance(parsed, dict):\n            return\
          \ {\"etf_recommendations\": \"null\"}\n        raw_list = parsed.get(\"\
          data\", [])\n        if not isinstance(raw_list, list):\n            return\
          \ {\"etf_recommendations\": \"null\"}\n\n        active = []\n        for\
          \ etf in raw_list:\n            if not isinstance(etf, dict):\n        \
          \        continue\n            exit_date = etf.get(\"etfExitDate\")\n  \
          \          holding_flag = etf.get(\"holdingExitFlag\", 0)\n            exit_ok\
          \ = exit_date is None or exit_date == \"\" or exit_date == \"null\"\n  \
          \          try:\n                hold_ok = int(holding_flag) == 1\n    \
          \        except (TypeError, ValueError):\n                hold_ok = False\n\
          \            if exit_ok and hold_ok:\n                active.append(etf)\n\
          \n        if not active:\n            return {\"etf_recommendations\": \"\
          null\"}\n\n        active.sort(key=lambda x: x.get(\"etfEntryDate\", \"\"\
          ) or \"\", reverse=True)\n        etf_reasons = _parse_etf_reasons(etf_reason_data)\n\
          \n        def _normalize_reason(s):\n            \"\"\"清洗理由文本：去空白，将 <br>\
          \ 转为空格。\"\"\"\n            if not s or not isinstance(s, str):\n       \
          \         return \"\"\n            s = s.strip()\n            if not s:\n\
          \                return \"\"\n            return s.replace(\"<br>\", \"\
          \ \").replace(\"<br/>\", \" \").replace(\"<br />\", \" \")\n\n        lines\
          \ = [\"ETF轮动换股策略推荐：\\n\"]\n        for idx, etf in enumerate(active, start=1):\n\
          \            fund_code = etf.get(\"fundCode\", \"null\") or \"null\"\n \
          \           fund_name = etf.get(\"fundName\", \"null\") or \"null\"\n  \
          \          industry_name = etf.get(\"industryName\", \"null\") or \"null\"\
          \n            entry_date = _format_date(etf.get(\"etfEntryDate\", \"\"))\n\
          \            holding_days = _holding_days(etf.get(\"etfEntryDate\", \"\"\
          ), current_date_str)\n            holding_days_str = f\"{holding_days}天\"\
          \ if holding_days is not None else \"null\"\n            # 入选理由：优先使用轮动数据中的\
          \ selectionReason，否则用 etf_reason_data\n            reason = _normalize_reason(etf.get(\"\
          selectionReason\") or etf.get(\"selection_reason\"))\n            if not\
          \ reason:\n                reason = _normalize_reason(etf_reasons.get(fund_code))\n\
          \            reason = reason if reason else \"null\"\n\n            lines.append(f\"\
          {idx}. {fund_name} ({fund_code})\\n\")\n            lines.append(f\"   -\
          \ 所属赛道：{industry_name}\\n\")\n            lines.append(f\"   - 入选时间：{entry_date}\\\
          n\")\n            lines.append(f\"   - 持仓天数：{holding_days_str}\\n\")\n \
          \           lines.append(f\"   - 选股理由：{reason}\\n\")\n\n        return {\"\
          etf_recommendations\": \"\".join(lines).strip()}\n\n    except Exception\
          \ as e:\n        return {\"etf_recommendations\": f\"ETF换股建议生成错误: {str(e)}\"\
          }\n"
        code_language: python3
        outputs:
          etf_recommendations:
            children: null
            type: string
        selected: false
        title: 不同赛道ETF轮动策略
        type: code
        variables:
        - value_selector:
          - '1775111405767'
          - text
          value_type: string
          variable: etf_rotation_data
        - value_selector:
          - '1772607427341'
          - output
          value_type: array[string]
          variable: etf_reason_data
