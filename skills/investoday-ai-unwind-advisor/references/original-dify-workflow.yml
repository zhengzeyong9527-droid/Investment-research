          json\"]:\n            c = signal_detail_input[\"json\"][0]\n           \
          \ return c if isinstance(c, dict) else None\n        return signal_detail_input\n\
          \    return None\n\n\ndef main(signal_detail_data):\n    \"\"\"\n    通过最新信号明细的\
          \ expireDate 判断当前是否处于波段信号期内：\n    - expireDate 为 null/空/\"null\" → 在信号期内（is_signal_period=\"\
