          \ 数组等），输出 data 为 JSON 字符串供下游使用。\n#\n# 输入变量（任一连线即可）：\n#   - 上游整体对象：{ \"text\"\
          : \"{\\\"data\\\":[...]}\", \"json\": [{ \"data\": [...] }] } 或 content/input/data/result\n\
          #\n# 输出变量：\n#   - data：Array[object]，仅保留最近 date 的基金对象列表\n#\n# 输出数据结构（行业持仓基金列表）：\n\
          #   { \"data\": [ ... ] }\n# 基金对象字段（常用）：\n#   - date, fundCode, fundName,\
          \ fundType, industryType/industryStandard, industryCode, industryName, industryLevel\n\
          #   - fundId, fundAsset, pressure, support\n# 占比字段（为下游“占比与规模优选”节点准备，确保输出包含这\
          \ 4 个字段）：\n#   - latestTotalPct\n#   - annualTotalPct\n#   - holdingPercentageLatestTotalAssets\n\
          #   - holdingPercentageAnnualTotalAssets\n\nimport json\n\n\ndef _extract_data_array(obj):\n\
          \    \"\"\"从任意形式的输入中提取 data 数组。返回 (list or None)。\"\"\"\n    if obj is None:\n\
          \        return None\n    if isinstance(obj, dict):\n        # Dify 常见格式：{\
          \ \"text\": \"...\", \"json\": [{ \"data\": [...] }] }，优先从 json 取\n    \
          \    if \"json\" in obj and isinstance(obj[\"json\"], list) and len(obj[\"\
          json\"]) > 0:\n            first = obj[\"json\"][0]\n            if isinstance(first,\
          \ dict) and \"data\" in first and isinstance(first[\"data\"], list):\n \
          \               return first[\"data\"]\n        if \"data\" in obj and isinstance(obj[\"\
          data\"], list):\n            return obj[\"data\"]\n        if \"text\" in\
          \ obj:\n            return _extract_data_array(obj[\"text\"])\n    if isinstance(obj,\
          \ str):\n        s = obj.strip()\n        if not s:\n            return\
          \ None\n        try:\n            parsed = json.loads(s)\n            return\
          \ _extract_data_array(parsed)\n        except json.JSONDecodeError:\n  \
          \          return None\n    return None\n\n\ndef _build_fund_obj(fund_item):\n\
          \    \"\"\"把 API 的一条基金记录转成输出结构（含行业持仓与规模/压力支撑等字段）。\"\"\"\n    if not isinstance(fund_item,\
          \ dict):\n        return None\n    fund_obj = {}\n    # 通用字段\n    for key\
          \ in (\n        \"date\",\n        \"fundCode\",\n        \"fundName\",\n\
          \        \"fundType\",\n        \"industryType\",\n        \"industryStandard\"\
          ,\n        \"industryCode\",\n        \"industryName\",\n        \"industryLevel\"\
          ,\n        \"fundId\",\n        \"fundAsset\",\n        \"pressure\",\n\
          \        \"support\",\n    ):\n        if key in fund_item:\n          \
          \  v = fund_item[key]\n            fund_obj[key] = str(v) if v is not None\
          \ else None\n\n    # 兼容接口返回的占比字段命名：holdingWeight*（占总资产） / holdingRatio*（占净资产）\n\
          \    holding_weight_latest = fund_item.get(\"holdingWeightLatest\")\n  \
          \  holding_weight_annual = fund_item.get(\"holdingWeightAnnual\")\n    holding_ratio_latest\
          \ = fund_item.get(\"holdingRatioLatest\")\n    holding_ratio_annual = fund_item.get(\"\
          holdingRatioAnnual\")\n\n    # 下游优选节点需要的 4 个字段（优先用 holdingWeight*，缺失时 fallback\
          \ 到 holdingRatio*）\n    latest_total = holding_weight_latest if holding_weight_latest\
          \ is not None else holding_ratio_latest\n    annual_total = holding_weight_annual\
          \ if holding_weight_annual is not None else holding_ratio_annual\n\n   \
          \ if latest_total is not None:\n        latest_total_str = str(latest_total)\n\
          \        fund_obj[\"latestTotalPct\"] = latest_total_str\n        fund_obj[\"\
          holdingPercentageLatestTotalAssets\"] = latest_total_str\n    if annual_total\
          \ is not None:\n        annual_total_str = str(annual_total)\n        fund_obj[\"\
          annualTotalPct\"] = annual_total_str\n        fund_obj[\"holdingPercentageAnnualTotalAssets\"\
          ] = annual_total_str\n\n    # 同时保留原始字段（如有），便于排查与后续扩展\n    for key in (\n\
          \        \"holdingWeightLatest\",\n        \"holdingWeightQuarterly\",\n\
          \        \"holdingWeightAnnual\",\n        \"holdingRatioLatest\",\n   \
          \     \"holdingRatioQuarterly\",\n        \"holdingRatioAnnual\",\n    \
          \    \"holdingRatioLatestPenetrated\",\n    ):\n        if key in fund_item\
          \ and key not in fund_obj:\n            v = fund_item[key]\n           \
          \ fund_obj[key] = str(v) if v is not None else None\n    map_total = {\n\
          \        \"holdingPercentageLatestTotalAssets\": \"latestTotalPct\",\n \
          \       \"holdingPercentageQuarterlyTotalAssets\": \"quarterlyTotalPct\"\
          ,\n        \"holdingPercentageAnnualTotalAssets\": \"annualTotalPct\",\n\
          \    }\n    for api_key, out_key in map_total.items():\n        if api_key\
          \ in fund_item:\n            v = fund_item[api_key]\n            fund_obj[out_key]\
          \ = str(v) if v is not None else None\n    map_net = {\n        \"holdingPercentageLatestNetAssets\"\
          : \"latestNetPct\",\n        \"holdingPercentageQuarterlyNetAssets\": \"\
          quarterlyNetPct\",\n        \"holdingPercentageAnnualNetAssets\": \"annualNetPct\"\
          ,\n        \"holdingPercentageLatestNetAssetsWithLookThrough\": \"latestNetPctLT\"\
          ,\n    }\n    for api_key, out_key in map_net.items():\n        if api_key\
          \ in fund_item:\n            v = fund_item[api_key]\n            fund_obj[out_key]\
          \ = str(v) if v is not None else None\n    return fund_obj\n\n\ndef main(content=None,\
          \ input=None, data=None, result=None, **kwargs):\n    # 上游可能是「行业持仓基金」节点的\
          \ result（JSON 字符串），或 content/input/data\n    params = kwargs.get(\"params\"\
          )\n    if isinstance(params, dict):\n        raw = (\n            params.get(\"\
          result\")\n            or params.get(\"content\")\n            or params.get(\"\
          input\")\n            or params.get(\"data\")\n        )\n    else:\n  \
          \      raw = result if result is not None else (content if content is not\
          \ None else (input if input is not None else data))\n\n    fund_list = []\n\
          \n    # 1) 直接是 dict/str：整段 API 返回\n    data_array = _extract_data_array(raw)\n\
          \    if isinstance(data_array, list):\n        for fund_item in data_array:\n\
          \            obj = _build_fund_obj(fund_item)\n            if obj is not\
          \ None:\n                fund_list.append(obj)\n\n    # 2) 是 content 数组（元素为\
          \ { \"text\": \"...\", \"type\": \"text\" }）\n    if not fund_list and isinstance(raw,\
          \ list):\n        for content_item in raw:\n            data_array = _extract_data_array(content_item)\n\
          \            if isinstance(data_array, list):\n                for fund_item\
          \ in data_array:\n                    obj = _build_fund_obj(fund_item)\n\
          \                    if obj is not None:\n                        fund_list.append(obj)\n\
          \n    # 只保留 date 最近一天的数据\n    if fund_list:\n        dates = [item.get(\"\
          date\") for item in fund_list if item.get(\"date\")]\n        if dates:\n\
          \            latest_date = max(dates)\n            fund_list = [item for\
          \ item in fund_list if item.get(\"date\") == latest_date]\n\n    return\
          \ {\"data\": fund_list}\n"
