    - data:
        code: "# Dify 代码节点：迭代提取基金代码（用于循环中查询基金技术指标等）\n# 输入变量：item（Object，当前迭代的基金对象，来自\
          \ matched_funds 等数组）\n# 输出变量：fund_code（String）\n\n\ndef main(item):\n  \
          \  \"\"\"\n    从当前迭代的基金对象中提取 fundCode。\n    在 Dify 循环/迭代中，将 item 传入本节点即可得到\
