    - data:
        code: "\"\"\"根据被套深度和仓位，输出亏损程度、被套仓位（均为 string）。\"\"\"\n\n\ndef get_loss_degree(depth:\
          \ float) -> str:\n    \"\"\"被套深度：轻套≤15%，中套(15%,30%]，深套>30%。\"\"\"\n    if\
          \ depth <= 15:\n        return \"轻套\"\n    if depth <= 30:\n        return\
          \ \"中套\"\n    return \"深套\"\n\n\ndef get_position_level(position: float)\
          \ -> str:\n    \"\"\"仓位：轻仓≤30%，中仓(30%,60%]，重仓>60%。\"\"\"\n    if position\
          \ <= 30:\n        return \"轻仓\"\n    if position <= 60:\n        return\
          \ \"中仓\"\n    return \"重仓\"\n\n\ndef main(depth: float, position: float)\
          \ -> dict:\n    \"\"\"输入 depth(%)、position(%)，输出 get_loss_degree、get_position_level（string）。\"\
          \"\"\n    depth = float(depth) if depth is not None else 0.0\n    position\
          \ = float(position) if position is not None else 0.0\n    return {\n   \
          \     \"get_loss_degree\": get_loss_degree(depth),\n        \"get_position_level\"\
          : get_position_level(position),\n    }\n"
