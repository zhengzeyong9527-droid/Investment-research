    - data:
        code: "# Dify 代码节点：判断 ETF 轮动数据是否存在（是否有仍在持仓的ETF）\n# 输入变量：etf_rotation_data（String\
          \ 或 Object 或 List）\n# 输出变量：\n# - etf_rotation_data：原始数据（原样透传）或字符串 \"null\"\
          \n# - has_data：字符串 \"true\"/\"false\"\n\nimport json\n\n\ndef _to_json(value):\n\
          \    if value is None:\n        return None\n    if isinstance(value, (dict,\
          \ list)):\n        return value\n    if isinstance(value, str):\n      \
          \  text = value.strip()\n        if not text:\n            return None\n\
          \        try:\n            return json.loads(text)\n        except Exception:\n\
          \            return None\n    return None\n\n\ndef _parse_rotation_input(etf_rotation_data):\n\
          \    \"\"\"将输入解析为 dict（包含 data 列表）或 None。\n\n    兼容以下常见形态：\n    - 直接 JSON\
          \ 字符串\n    - 直接 dict（已是解析后的 JSON）\n    - Dify 工具返回包装：{\"text\": \"{...}\"\
          } 或 {\"json\": [{...}]} 或 {\"data\": [...], ...}\n    - 列表：[{ \"text\":\
          \ \"{...}\" }]（常见于部分平台/工具节点输出）\n    \"\"\"\n    if not etf_rotation_data:\n\
          \        return None\n\n    # 列表包装：取第一项\n    if isinstance(etf_rotation_data,\
          \ list):\n        if not etf_rotation_data:\n            return None\n \
          \       first = etf_rotation_data[0]\n        if isinstance(first, dict):\n\
          \            if first.get(\"text\"):\n                return _to_json(first.get(\"\
          text\"))\n            if first.get(\"json\") and isinstance(first[\"json\"\
          ], list) and first[\"json\"]:\n                candidate = first[\"json\"\
          ][0]\n                return candidate if isinstance(candidate, dict) else\
          \ None\n            return first if isinstance(first, dict) else None\n\
          \        if isinstance(first, str):\n            return _to_json(first)\n\
          \        return None\n\n    # 字符串：直接解析\n    if isinstance(etf_rotation_data,\
          \ str):\n        return _to_json(etf_rotation_data)\n\n    # dict：处理 Dify\
          \ 常见包装\n    if isinstance(etf_rotation_data, dict):\n        if etf_rotation_data.get(\"\
          text\"):\n            return _to_json(etf_rotation_data.get(\"text\"))\n\
          \        if etf_rotation_data.get(\"json\") and isinstance(etf_rotation_data[\"\
          json\"], list) and etf_rotation_data[\"json\"]:\n            candidate =\
          \ etf_rotation_data[\"json\"][0]\n            return candidate if isinstance(candidate,\
          \ dict) else None\n        return etf_rotation_data\n\n    return None\n\
          \n\ndef _has_valid_holding_etf(parsed_data):\n    \"\"\"判定是否存在“仍在持仓”的 ETF。\n\
          \n    规则（沿用你给的 Coze 版本）：\n    - data 数组非空\n    - 至少存在一条：holdingExitFlag\
          \ == 1 且 etfExitDate 为空/None/\"null\"\n    \"\"\"\n    if not isinstance(parsed_data,\
          \ dict):\n        return False\n\n    data_list = parsed_data.get(\"data\"\
          , [])\n    if not isinstance(data_list, list) or not data_list:\n      \
          \  return False\n\n    for etf in data_list:\n        if not isinstance(etf,\
          \ dict):\n            continue\n        exit_date = etf.get(\"etfExitDate\"\
          )\n        holding_flag = etf.get(\"holdingExitFlag\", 0)\n\n        exit_date_empty\
          \ = exit_date is None or exit_date == \"\" or exit_date == \"null\"\n  \
          \      try:\n            holding_flag_ok = int(holding_flag) == 1\n    \
          \    except Exception:\n            holding_flag_ok = False\n\n        if\
          \ exit_date_empty and holding_flag_ok:\n            return True\n\n    return\
          \ False\n\n\ndef main(etf_rotation_data):\n    try:\n        parsed = _parse_rotation_input(etf_rotation_data)\n\
          \        has_data = _has_valid_holding_etf(parsed)\n        if has_data:\n\
          \            return {\"etf_rotation_data\": etf_rotation_data, \"has_data\"\
          : \"true\"}\n        return {\"etf_rotation_data\": \"null\", \"has_data\"\
          : \"false\"}\n    except Exception:\n        return {\"etf_rotation_data\"\
          : \"null\", \"has_data\": \"false\"}\n\n"
        code_language: python3
