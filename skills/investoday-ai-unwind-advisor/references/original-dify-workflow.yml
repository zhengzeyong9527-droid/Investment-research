          \ or it.get(\"id\") or \"\"\n\n        dedup_key = (str(news_id).strip()\
          \ if news_id and str(news_id).strip() else title_norm, date_part)\n    \
          \    if dedup_key in seen:\n            continue\n        seen.add(dedup_key)\n\
          \n        basis = f\"{news_id}|{title_norm}|{date_part}\" if (news_id and\
          \ str(news_id).strip()) else f\"{title_norm}|{date_part}\"\n        item_id\
          \ = hashlib.sha1(basis.encode(\"utf-8\")).hexdigest()[:16]\n\n        summary_text\
          \ = it.get(\"summary\") or \"\"\n        if isinstance(summary_text, dict):\n\
          \            try:\n                summary_text = json.dumps(summary_text,\
          \ ensure_ascii=False)\n            except Exception:\n                summary_text\
          \ = str(summary_text)\n        summary_trim = (\n            (summary_text[:180]\
          \ + \"...\") if (isinstance(summary_text, str) and len(summary_text) > 180)\
          \ else summary_text\n        )\n\n        news_type_val = it.get(\"newsType\"\
          )\n        try:\n            news_type_val = int(news_type_val) if news_type_val\
          \ is not None else None\n        except Exception:\n            pass\n\n\
          \        key_points = it.get(\"keyPoints\", \"\")\n        text = title\
          \ + \" \" + (key_points or \"\")\n        words = re.findall(r\"[\\u4e00-\\\
          u9fa5]{2,}\", text)\n        keywords = []\n        keywords_seen = set()\n\
          \        for word in words:\n            if word not in keywords_seen and\
          \ len(word) >= 2:\n                keywords.append(word)\n             \
          \   keywords_seen.add(word)\n                if len(keywords) >= 8:\n  \
          \                  break\n\n        sentiment = it.get(\"sentiment\", 3)\n\
          \        sentiment_types = {5: \"利多\", 4: \"中性偏多\", 3: \"中性\", 2: \"中性偏空\"\
          , 1: \"利空\"}\n        sentiment_text = sentiment_types.get(sentiment, \"\
          未知\")\n\n        sentiment_score = it.get(\"sentimentScore\")\n        if\
          \ sentiment_score is not None:\n            try:\n                sentiment_score\
          \ = float(sentiment_score)\n            except (ValueError, TypeError):\n\
          \                sentiment_score = None\n\n        citation = f\"{title_norm}-今日投资研报库-{date_part}\"\
          \n        display_id = f\"N{len(news_list) + 1}\"\n\n        news_list.append({\n\
          \            \"item_id\": item_id,\n            \"title\": title_norm,\n\
          \            \"pub_date\": date_part,\n            \"newsType\": news_type_val,\n\
          \            \"summary\": summary_trim,\n            \"impactAnalysis\"\
          : it.get(\"impactAnalysis\"),\n            \"sentimentScore\": sentiment_score,\n\
          \            \"id\": display_id,\n            \"sentiment\": sentiment_text,\n\
          \            \"keywords\": keywords,\n            \"citation\": citation,\n\
          \        })\n\n        if len(news_list) >= MAX_ITEMS:\n            break\n\
          \n    return news_list\n"
