    - data:
        code: "# Dify 代码节点：基本面分析数据格式化（供 LLM 分析）\n# 功能：从基本面分析 API 原始输出中提取 data，去掉 data_schema、ext_message，去掉空字段，输出精简列表（减\
          \ token）\n# 输入变量（在 Dify 中命名为 arg1 或接入上游节点输出）：\n#   - arg1（String 或 Object）：API\
          \ 返回，格式为 {\"data\":[...],\"data_schema\":...,\"ext_message\":...}\n#   \
          \  或完整包装 {\"text\":\"...\",\"files\":[],\"json\":[{\"data\":[...],\"data_schema\"\
          :...,\"ext_message\":...}]}\n# 输出变量：\n#   - fundamental_list（String）：JSON\
          \ 数组字符串，供下游 LLM 或展示使用\n\nimport json\nfrom typing import List, Dict, Any\n\
          \n\ndef main(arg1=None, fundamental_input=None, **kwargs):\n    \"\"\"\n\
          \    Dify 入口：接收基本面分析 API 原始输出，提取 data 列表并返回 fundamental_list（JSON 字符串）。\n\
          \    输入变量名：arg1、fundamental_input、fundamental_input_、result、body、response\
          \ 等。\n    \"\"\"\n    raw = (\n        arg1\n        or fundamental_input\n\
          \        or kwargs.get(\"fundamental_input_\")\n        or kwargs.get(\"\
          fundamental\")\n        or kwargs.get(\"result\")\n        or kwargs.get(\"\
          body\")\n        or kwargs.get(\"response\")\n    )\n    try:\n        items\
          \ = _extract_items(raw)\n    except Exception:\n        items = []\n\n \
          \   # 每条去掉空字符串字段，减少 token\n    fundamental_list = [_trim_empty_fields(it)\
          \ for it in items]\n    return {\"fundamental_list\": json.dumps(fundamental_list,\
          \ ensure_ascii=False)}\n\n\ndef _trim_empty_fields(obj: Dict[str, Any])\
          \ -> Dict[str, Any]:\n    \"\"\"去掉值为空字符串的键，保留有内容的字段。\"\"\"\n    if not isinstance(obj,\
          \ dict):\n        return obj\n    return {k: v for k, v in obj.items() if\
          \ v is not None and str(v).strip() != \"\"}\n\n\ndef _extract_items(raw)\
          \ -> List[Dict[str, Any]]:\n    \"\"\"\n    从 API 输出中提取 data 数组。\n    支持：{\"\
          text\":\"...\",\"json\":[{\"data\":[...]}]}、{\"data\":[...]}、或上述 JSON 的字符串形式。\n\
          \    \"\"\"\n    items: List[Dict[str, Any]] = []\n\n    if raw is None:\n\
          \        return items\n\n    def _data_from_obj(obj):\n        if not isinstance(obj,\
          \ dict):\n            return None\n        if \"data\" in obj and isinstance(obj[\"\
          data\"], list):\n            return obj[\"data\"]\n        if \"json\" in\
          \ obj and isinstance(obj[\"json\"], list) and obj[\"json\"]:\n         \
          \   first = obj[\"json\"][0]\n            if isinstance(first, dict) and\
          \ \"data\" in first and isinstance(first[\"data\"], list):\n           \
          \     return first[\"data\"]\n        if \"text\" in obj and obj[\"text\"\
          ]:\n            try:\n                parsed = json.loads(obj[\"text\"])\n\
          \                return _data_from_obj(parsed)\n            except Exception:\n\
          \                pass\n        if \"content\" in obj:\n            c = obj[\"\
          content\"]\n            if isinstance(c, str) and c.strip():\n         \
          \       try:\n                    parsed = json.loads(c.strip())\n     \
          \               return _data_from_obj(parsed) if isinstance(parsed, dict)\
          \ else None\n                except Exception:\n                    pass\n\
          \            if isinstance(c, list) and c and isinstance(c[0], dict) and\
          \ c[0].get(\"text\"):\n                try:\n                    parsed\
          \ = json.loads(c[0][\"text\"])\n                    return _data_from_obj(parsed)\
          \ if isinstance(parsed, dict) else None\n                except Exception:\n\
          \                    pass\n        return None\n\n    # 单元素列表（元素为 dict 或字符串）\n\
          \    if isinstance(raw, list) and len(raw) == 1:\n        only = raw[0]\n\
          \        if isinstance(only, dict):\n            data = _data_from_obj(only)\n\
          \            if data is not None:\n                return data\n       \
          \     if \"data\" in only and isinstance(only[\"data\"], list):\n      \
          \          return only[\"data\"]\n        elif isinstance(only, str) and\
          \ only.strip():\n            try:\n                parsed = json.loads(only.strip())\n\
          \                data = _data_from_obj(parsed) if isinstance(parsed, dict)\
          \ else None\n                if data is not None:\n                    return\
          \ data\n                if isinstance(parsed, dict) and \"data\" in parsed\
          \ and isinstance(parsed[\"data\"], list):\n                    return parsed[\"\
          data\"]\n            except Exception:\n                pass\n\n    # 直接为\
          \ dict（完整包装或仅 data）\n    if isinstance(raw, dict):\n        data = _data_from_obj(raw)\n\
          \        if data is not None:\n            return data\n        if \"data\"\
          \ in raw and isinstance(raw[\"data\"], list):\n            return raw[\"\
          data\"]\n        return items\n\n    # 字符串\n    if isinstance(raw, str):\n\
          \        raw = raw.strip()\n        if not raw:\n            return items\n\
          \        try:\n            root = json.loads(raw)\n        except Exception:\n\
          \            return items\n        if isinstance(root, dict):\n        \
          \    data = _data_from_obj(root)\n            if data is not None:\n   \
          \             return data\n            if \"data\" in root and isinstance(root[\"\
          data\"], list):\n                return root[\"data\"]\n        if isinstance(root,\
          \ list) and root and isinstance(root[0], dict) and \"data\" in root[0]:\n\
          \            return root[0][\"data\"]\n\n    return items\n"
        code_language: python3
        outputs:
          fundamental_list:
            children: null
            type: string
