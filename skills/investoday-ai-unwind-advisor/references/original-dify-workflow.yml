    - data:
        code: "# Dify 代码节点：从股票所属行业接口返回中提取申万行业等级（仅三个等级代码）\n# 输入变量：industry_response，类型\
          \ String 或 Object（支持 text/json 两种结构）\n# 输出变量：industry_code_sw_l1, industry_code_sw_l2,\
          \ industry_code_sw_l3\n\nimport json\n\n\ndef _to_json(value):\n    if value\
          \ is None:\n        return None\n    if isinstance(value, (dict, list)):\n\
          \        return value\n    if isinstance(value, str):\n        text = value.strip()\n\
          \        if not text:\n            return None\n        try:\n         \
          \   return json.loads(text)\n        except Exception:\n            return\
          \ None\n    return None\n\n\ndef _extract_data_list(api_response):\n   \
          \ \"\"\"从接口返回中解析出 data 列表。支持三种结构：\n    1) 完整包装：json[0].data；2) text 为 JSON\
          \ 字符串，其内有 data；3) 顶层直接有 data。\"\"\"\n    if api_response is None:\n    \
          \    return []\n    if isinstance(api_response, str):\n        api_response\
          \ = _to_json(api_response)\n    if not isinstance(api_response, dict):\n\
          \        return []\n    if api_response.get(\"json\") and isinstance(api_response[\"\
          json\"], list) and api_response[\"json\"]:\n        first = api_response[\"\
          json\"][0]\n        if isinstance(first, dict) and \"data\" in first:\n\
          \            data = first[\"data\"]\n            return data if isinstance(data,\
          \ list) else [data]\n    if api_response.get(\"text\"):\n        parsed\
          \ = _to_json(api_response[\"text\"])\n        if isinstance(parsed, dict)\
          \ and \"data\" in parsed:\n            data = parsed[\"data\"]\n       \
          \     return data if isinstance(data, list) else [data]\n    if \"data\"\
          \ in api_response:\n        data = api_response[\"data\"]\n        if isinstance(data,\
          \ list) and data:\n            return data\n        if isinstance(data,\
          \ dict):\n            return [data]\n    return []\n\n\ndef _extract_sw_codes(record):\n\
          \    \"\"\"从单条 data 记录中提取申万一级/二级/三级行业代码。\"\"\"\n    if not isinstance(record,\
          \ dict):\n        return None\n    return {\n        \"industry_code_sw_l1\"\
          : record.get(\"industryCodeSwL1\") or \"\",\n        \"industry_code_sw_l2\"\
          : record.get(\"industryCodeSwL2\") or \"\",\n        \"industry_code_sw_l3\"\
          : record.get(\"industryCodeSwL3\") or \"\",\n    }\n\n\ndef main(industry_response):\n\
          \    \"\"\"\n    输入：industry_response，股票所属行业接口（如 9.21）返回的完整 JSON。\n    输出：仅三个等级代码\
          \ industry_code_sw_l1, industry_code_sw_l2, industry_code_sw_l3。\n    \"\
          \"\"\n    empty = {\n        \"industry_code_sw_l1\": \"\",\n        \"\
          industry_code_sw_l2\": \"\",\n        \"industry_code_sw_l3\": \"\",\n \
          \   }\n    data_list = _extract_data_list(industry_response)\n    if not\
          \ data_list:\n        return empty\n    first = _extract_sw_codes(data_list[0])\n\
          \    return first if first else empty\n"
        code_language: python3
