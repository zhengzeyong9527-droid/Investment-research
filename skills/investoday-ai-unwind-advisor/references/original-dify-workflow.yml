          title\")):\n                    items.append(elem)\n            return items\n\
          \n    return items\n\n\ndef _build_unified_news_list(items: List[Dict[str,\
          \ Any]]) -> List[Dict[str, Any]]:\n    \"\"\"\n    构建统一新闻列表：含分析字段与溯源字段，去重、上限\
          \ 100 条。\n    去重键：newsId 或 (title_norm, date_part)。\n    \"\"\"\n    seen\
          \ = set()\n    news_list: List[Dict[str, Any]] = []\n    MAX_ITEMS = 100\n\
          \n    for it in items:\n        title = (it.get(\"title\") or \"\").strip()\
