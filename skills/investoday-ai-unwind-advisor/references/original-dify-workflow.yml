          \       first = etf_rotation_data[0]\n        if isinstance(first, dict):\n\
          \            if first.get(\"text\"):\n                return _to_json(first.get(\"\
          text\"))\n            if first.get(\"json\") and isinstance(first[\"json\"\
          ], list) and first[\"json\"]:\n                candidate = first[\"json\"\
          ][0]\n                return candidate if isinstance(candidate, dict) else\
          \ None\n            return first\n        if isinstance(first, str):\n \
          \           return _to_json(first)\n        return None\n    if isinstance(etf_rotation_data,\
          \ str):\n        return _to_json(etf_rotation_data)\n    if isinstance(etf_rotation_data,\
          \ dict):\n        if etf_rotation_data.get(\"text\"):\n            return\
          \ _to_json(etf_rotation_data.get(\"text\"))\n        if etf_rotation_data.get(\"\
          json\") and isinstance(etf_rotation_data[\"json\"], list) and etf_rotation_data[\"\
          json\"]:\n            candidate = etf_rotation_data[\"json\"][0]\n     \
          \       return candidate if isinstance(candidate, dict) else None\n    \
          \    return etf_rotation_data\n    return None\n\n\ndef main(etf_rotation_data):\n\
          \    \"\"\"\n    从 ETF 轮动策略数据中提取仍在持仓的 ETF（etfExitDate 为空且 holdingExitFlag==1），\n\
          \    按 etfEntryDate 倒序，输出代码与名称数组。\n    \"\"\"\n    try:\n        parsed\
          \ = _parse_rotation_input(etf_rotation_data)\n        if not parsed or not\
          \ isinstance(parsed, dict):\n            return {\"etf_list\": []}\n   \
          \     raw_list = parsed.get(\"data\", [])\n        if not isinstance(raw_list,\
          \ list):\n            return {\"etf_list\": []}\n\n        active = []\n\
          \        for etf in raw_list:\n            if not isinstance(etf, dict):\n\
          \                continue\n            exit_date = etf.get(\"etfExitDate\"\
          )\n            holding_flag = etf.get(\"holdingExitFlag\", 0)\n        \
          \    exit_ok = exit_date is None or exit_date == \"\" or exit_date == \"\
          null\"\n            try:\n                hold_ok = int(holding_flag) ==\
          \ 1\n            except (TypeError, ValueError):\n                hold_ok\
          \ = False\n            if exit_ok and hold_ok:\n                active.append(etf)\n\
          \n        active.sort(key=lambda x: x.get(\"etfEntryDate\", \"\") or \"\"\
          , reverse=True)\n\n        etf_list = [\n            {\n               \
          \ \"fund_code\": (etf.get(\"fundCode\") or \"\").strip(),\n            \
          \    \"fund_name\": (etf.get(\"fundName\") or \"\").strip(),\n         \
          \   }\n            for etf in active\n        ]\n\n        return {\"etf_list\"\
          : etf_list}\n    except Exception:\n        return {\"etf_list\": []}\n"
