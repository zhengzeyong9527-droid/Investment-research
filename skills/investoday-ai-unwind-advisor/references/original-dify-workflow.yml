          \ item, ...]\n    \"\"\"\n    items: List[Dict[str, Any]] = []\n\n    if\
          \ arg1 is None:\n        return items\n\n    # 统一从“已解析的 dict”中取 data 的辅助函数\n\
          \    def _data_from_obj(obj):\n        if not isinstance(obj, dict):\n \
